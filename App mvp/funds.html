<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funds App</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f7f2;
      --app: #f8faf5;
      --surface: #ffffff;
      --surface-2: #eef2ea;
      --surface-3: #e8ebe6;
      --glass: rgb(248 250 245 / .96);
      --panel: rgb(255 255 255 / .98);
      --body-bg: #f5f7f2;
      --ink: #0e0f0c;
      --muted: #454745;
      --muted-2: #868685;
      --line: rgb(14 15 12 / .12);
      --soft-line: rgb(14 15 12 / .08);
      --active-bg: #0e0f0c;
      --active-border: #0e0f0c;
      --on-active: #ffffff;
      --brand: #9fe870;
      --brand-hover: #cdffad;
      --brand-dark: #163300;
      --on-brand: #163300;
      --mint: #e2f6d5;
      --device-shell: #0e0f0c;
      --blue: #2e6fd8;
      --red: #d03238;
      --amber: #b87500;
      --green: #054d28;
      --danger: var(--red);
      --ring: rgb(14 15 12 / .12) 0 0 0 1px;
      --shadow: var(--ring);
      --shadow-soft: var(--ring);
      --focus: 0 0 0 3px rgb(159 232 112 / .34), inset 0 0 0 1px #163300;
      --radius: 16px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-feature-settings: "calt" 1;
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --page: #090b08;
      --app: #11140f;
      --surface: #171b15;
      --surface-2: #22281f;
      --surface-3: #2b3327;
      --glass: rgb(17 20 15 / .96);
      --panel: rgb(23 27 21 / .98);
      --body-bg: #090b08;
      --ink: #f7faef;
      --muted: #c5cabb;
      --muted-2: #969d8d;
      --line: rgb(226 246 213 / .16);
      --soft-line: rgb(226 246 213 / .1);
      --active-bg: #9fe870;
      --active-border: #9fe870;
      --on-active: #163300;
      --brand: #9fe870;
      --brand-hover: #cdffad;
      --brand-dark: #cdffad;
      --on-brand: #163300;
      --mint: #25381d;
      --device-shell: #0e0f0c;
      --blue: #72a7ff;
      --red: #ff777b;
      --amber: #ffd11a;
      --green: #9fe870;
      --danger: var(--red);
      --ring: rgb(226 246 213 / .16) 0 0 0 1px;
      --shadow: var(--ring);
      --shadow-soft: var(--ring);
      --focus: 0 0 0 3px rgb(159 232 112 / .28), inset 0 0 0 1px #9fe870;
    }

    html {
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--body-bg);
      color: var(--ink);
      letter-spacing: 0;
    }

    button,
    select,
    input {
      font: inherit;
      font-feature-settings: "calt" 1;
    }

    button {
      cursor: pointer;
      transition: border-color .18s ease, background-color .18s ease, color .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    button:hover:not(:disabled):not([aria-disabled="true"]) {
      border-color: var(--brand);
      transform: scale(1.02);
    }

    button:active:not(:disabled):not([aria-disabled="true"]) {
      transform: scale(.97);
    }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 0;
      box-shadow: var(--focus);
    }

    .stage {
      width: 100%;
      max-width: 100vw;
      min-height: 100vh;
      padding: 34px 24px 110px;
      display: grid;
      grid-template-columns: minmax(0, 430px);
      gap: 24px 32px;
      justify-content: center;
      justify-items: center;
      align-items: start;
      overflow-x: clip;
    }

    .device {
      width: min(392px, calc(100vw - 34px));
      max-width: 100%;
      min-width: 0;
      border: 8px solid var(--device-shell);
      border-radius: 34px;
      background: var(--device-shell);
      box-shadow: var(--ring);
    }

    .app {
      position: relative;
      width: 100%;
      min-width: 0;
      height: min(812px, calc(100vh - 56px));
      min-height: 650px;
      overflow: hidden;
      border-radius: 25px;
      background: var(--app);
      display: flex;
      flex-direction: column;
    }

    .status {
      height: 30px;
      padding: 8px 18px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink);
      font-size: 11px;
      font-weight: 780;
      background: var(--glass);
    }

    .appbar {
      padding: 12px 18px 14px;
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      gap: 10px;
      align-items: center;
      background: var(--glass);
      border-bottom: 1px solid var(--line);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 9999px;
      background: var(--surface);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: 17px;
      font-weight: 780;
    }

    .icon-btn:hover {
      background: var(--mint);
    }

    .ph-icon {
      width: 1em;
      height: 1em;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-btn .ph-icon {
      width: 19px;
      height: 19px;
    }

    .title {
      min-width: 0;
      text-align: center;
    }

    .title strong {
      display: block;
      font-size: 19px;
      line-height: 1.16;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      margin-top: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--brand);
      color: var(--on-brand);
      font-size: 11px;
      font-weight: 800;
    }

    .content {
      flex: 1;
      padding: 14px 16px 22px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-x: none;
    }

    .content:has(+ .flow-action.show) {
      padding-bottom: 28px;
    }

    .hero-card {
      position: relative;
      min-height: 208px;
      padding: 22px;
      overflow: hidden;
      border-radius: 30px;
      color: var(--ink);
      background: var(--mint);
      box-shadow: var(--ring);
      display: grid;
      align-content: space-between;
      border: 1px solid var(--line);
    }

    .hero-card.alt {
      background: var(--surface);
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 84% 20%, var(--brand) 0 44px, transparent 45px),
        linear-gradient(90deg, rgb(22 51 0 / .05) 0 1px, transparent 1px 100%);
      background-size: auto, 30px 100%;
      opacity: .72;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 78px;
      height: 1px;
      background: var(--line);
      pointer-events: none;
    }

    .metric-label {
      position: relative;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric-value {
      position: relative;
      margin-top: 14px;
      font-size: 40px;
      font-weight: 900;
      line-height: .95;
      letter-spacing: 0;
    }

    .metric-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 24px;
    }

    .mini-metric {
      min-height: 54px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: 0;
    }

    .mini-metric span,
    .mini-metric b {
      display: block;
    }

    .mini-metric span {
      color: var(--muted);
      font-size: 11px;
    }

    .mini-metric b {
      margin-top: 6px;
      font-size: 14px;
      color: var(--ink);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 12px 0;
    }

    .quick-grid.two {
      grid-template-columns: repeat(2, 1fr);
    }

    .quick-grid.one {
      grid-template-columns: 1fr;
    }

    .quick-grid.four {
      grid-template-columns: repeat(2, 1fr);
    }

    .quick {
      min-height: 74px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      display: grid;
      place-items: center;
      align-content: center;
      gap: 7px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 850;
      box-shadow: var(--ring);
    }

    .quick span {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9999px;
      background: var(--brand);
      color: var(--brand-dark);
      font-size: 16px;
      line-height: 1;
    }

    .quick span .ph-icon {
      width: 17px;
      height: 17px;
      stroke-width: 2.3;
    }

    .quick:hover span {
      background: var(--brand-hover);
      color: var(--brand-dark);
    }

    .quick[aria-disabled="true"] {
      cursor: not-allowed;
      opacity: .48;
      filter: saturate(.72);
    }

    .section-title {
      margin: 20px 1px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      font-weight: 860;
    }

    .section-title small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
    }

    .list {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
    }

    .item {
      min-width: 0;
      max-width: 100%;
      min-height: 62px;
      padding: 13px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--ring);
    }

    .item:hover {
      border-color: var(--brand);
      background: var(--mint);
    }

    .item-main {
      min-width: 0;
    }

    .item-main strong {
      display: block;
      font-size: 13px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-main span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .amount {
      flex: 0 1 auto;
      min-width: 0;
      max-width: 42%;
      text-align: right;
      font-size: 13px;
      font-weight: 860;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .amount small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 720;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      flex: 0 0 auto;
      min-height: 25px;
      padding: 5px 8px;
      border-radius: 999px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.green { background: var(--green); }
    .badge.amber { background: var(--amber); color: var(--ink); }
    .badge.red { background: var(--danger); }
    .badge.blue { background: var(--blue); }
    .badge.gray { background: var(--muted-2); }

    .form {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    .form > * {
      min-width: 0;
      max-width: 100%;
    }

    .field {
      min-height: 68px;
      padding: 13px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }

    .field label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
    }

    .field-value {
      min-width: 0;
      margin-top: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      font-weight: 820;
    }

    .field-value strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: inherit;
      font-weight: inherit;
    }

    .field-value span {
      min-width: 0;
      max-width: 56%;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .select-field {
      width: 100%;
      min-height: 68px;
      padding: 13px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      box-shadow: var(--ring);
    }

    .select-field:hover:not([aria-disabled="true"]) {
      background: var(--mint);
    }

    .select-field label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      pointer-events: none;
    }

    .select-field .field-value {
      pointer-events: none;
    }

    .select-field[data-open-drawer]:not([aria-disabled="true"]) .field-value::after {
      content: "›";
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--brand-dark);
      font-size: 18px;
      font-weight: 780;
      line-height: 1;
      background: var(--brand);
    }

    .select-field[aria-disabled="true"] {
      cursor: default;
    }

    .search-field {
      width: 100%;
      min-height: 52px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--ring);
      font-size: 13px;
      font-weight: 760;
    }

    .search-field::placeholder {
      color: var(--muted-2);
    }

    .transfer-panel {
      padding: 18px 14px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--ring);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
    }

    .transfer-panel > * {
      min-width: 0;
      max-width: 100%;
    }

    .transfer-to-row {
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--ink);
      text-align: left;
    }

    .transfer-to-row span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 820;
    }

    .transfer-to-row strong {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.15;
    }

    .transfer-to-row strong::before {
      content: "";
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--ink);
      mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill='black' d='M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12v2H5v1zM16 13h5v4h-5a2 2 0 0 1 0-4z'/%3E%3C/svg%3E") center / contain no-repeat;
    }

    .transfer-to-row b {
      flex: 0 0 auto;
      color: var(--ink);
      font-size: 28px;
      line-height: 1;
      font-weight: 500;
    }

    .transfer-rule {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.42;
      font-weight: 680;
    }

    .transfer-rule button {
      margin-top: 5px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 13px;
      font-weight: 780;
    }

    .account-options,
    .channel-grid {
      display: grid;
      gap: 9px;
    }

    .account-option,
    .channel-card {
      width: 100%;
      min-height: 66px;
      padding: 13px 12px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .account-option.active,
    .channel-card.active {
      border-color: var(--active-border);
      background: var(--active-bg);
      color: var(--on-active);
    }

    .account-option.active span,
    .channel-card.active span,
    .account-option.active small,
    .channel-card.active small {
      color: rgb(255 255 255 / .78);
    }

    .account-option strong,
    .channel-card strong {
      display: block;
      font-size: 13px;
    }

    .account-option span,
    .channel-card span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
    }

    .channel-card.disabled {
      cursor: not-allowed;
      opacity: .46;
      filter: saturate(.6);
    }

    .keypad {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
    }

    .amount-stage {
      min-height: 184px;
      padding: 20px;
      border-radius: 30px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--ring);
    }

    .amount-stage label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .amount-display {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 16px;
    }

    .amount-display span {
      color: var(--muted);
      font-size: 20px;
      font-weight: 820;
    }

    .amount-display strong {
      font-size: 46px;
      line-height: 1;
      font-weight: 900;
    }

    .amount-stage .chips {
      margin-top: 24px;
    }

    .amount-stage .chip {
      border-color: var(--line);
      background: var(--surface);
      color: var(--ink);
      box-shadow: none;
    }

    .amount-stage .chip.active {
      border-color: var(--active-border);
      background: var(--brand);
      color: var(--on-brand);
    }

    body[data-theme="dark"] .amount-stage {
      color: var(--ink);
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      border-color: var(--line);
      box-shadow: none;
    }

    .money-input {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      padding: 8px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .money-input span {
      color: var(--muted);
      font-size: 18px;
      font-weight: 800;
    }

    .money-input strong {
      font-size: 38px;
      line-height: 1;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .chip {
      min-height: 30px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .chip.active {
      border-color: var(--active-border);
      background: var(--brand);
      color: var(--on-brand);
    }

    .primary {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      border: 0;
      border-radius: 9999px;
      background: var(--brand);
      color: var(--on-brand);
      font-size: 15px;
      font-weight: 860;
      box-shadow: none;
    }

    .primary:hover:not(:disabled) {
      background: var(--brand-hover);
      transform: translateY(-1px);
    }

    .primary:disabled {
      cursor: not-allowed;
      opacity: .48;
      box-shadow: none;
    }

    .flow-action {
      display: none;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: var(--glass);
      backdrop-filter: blur(16px);
    }

    .flow-action.show {
      display: block;
    }

    .flow-action .primary {
      margin-top: 0;
    }

    .upload-card {
      width: 100%;
      min-height: 150px;
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 30px;
      background: var(--surface);
      color: var(--ink);
      display: grid;
      place-items: center;
      align-content: center;
      gap: 10px;
      text-align: center;
    }

    .upload-card b {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 9999px;
      background: var(--surface-2);
      color: var(--brand-dark);
      font-size: 22px;
      line-height: 1;
    }

    .upload-card strong {
      display: block;
      font-size: 14px;
      font-weight: 860;
    }

    .upload-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .upload-card.active {
      border-style: solid;
      border-color: var(--active-border);
    }

    .toast {
      position: fixed;
      left: 50%;

    function clientCard(initials, name, assets, progress, status) {
      const statusText = String(status).toLowerCase();
      const statusTone = status.includes("待") || status.includes("缺") || status.includes("失败") || statusText.includes("pending") || statusText.includes("missing") || statusText.includes("failed") || statusText.includes("review") ? "amber" : "green";
      return `
        <div class="client-card">
          <div class="client-head">
            <div class="avatar-row">
              <div class="avatar">${initials}</div>
              <div class="item-main">
                <strong>${name}</strong>
                <span>${assets}</span>
              </div>
            </div>
            ${badge(status, statusTone)}
          </div>
          <div class="progress"><b style="width:${progress}"></b></div>
        </div>
      `;
    }

    function currentScenes() {
      return roles[appState.role].scenes;
    }

    function sceneName(sceneId) {
      const found = currentScenes().find(([id]) => id === sceneId);
      return found ? (appState.lang === "zh" ? found[1] : found[2]) : "";
    }

    function ensureScene() {
      const ids = currentScenes().map(([id]) => id);
      if (!ids.includes(appState.scene)) {
        appState.scene = ids[0];
      }
    }

    function roleKind() {
      return appState.role === "ib" ? "partner" : "trader";
    }

    function closeDrawer() {
      appState.activeDrawer = null;
      renderDrawer();
    }

    function lockHorizontalScroll() {
      screen.scrollLeft = 0;
      document.documentElement.scrollLeft = 0;
      document.body.scrollLeft = 0;
    }

      document.documentElement.lang = appState.lang === "zh" ? "zh-CN" : "en";

      panelState.textContent = `${appState.platform === "web" ? t("Web端", "Web") : t("App端", "App")} / ${appState.regulatoryMode === "regulated" ? t("监管", "Regulated") : t("非监管", "Non-regulated")} / ${roleName(roles[appState.role])} / ${sceneName(appState.scene)} / ${exceptionLabel()}`;
    }

    function renderTabbar() {
      tabbar.innerHTML = roles[appState.role].tabs
        .map(([scene, iconName, zh, en]) => `
          <button class="tab ${scene === appState.scene ? "active" : ""}" type="button" data-tab="${scene}">
            <b>${icon(iconName)}</b>
            ${t(zh, en)}
          </button>
        `)
        .join("");
    }

    function renderDrawer() {
      const drawer = appState.activeDrawer;
      drawerBackdrop.classList.toggle("open", Boolean(drawer));
      bottomDrawer.classList.toggle("open", Boolean(drawer));
      lockHorizontalScroll();

      if (!drawer) {
        drawerTitle.textContent = t("选择", "Select");
        drawerList.innerHTML = "";
        return;
      }

      const kind = roleKind();

      if (drawer === "depositAccount" || drawer === "withdrawAccount") {
        const isDeposit = drawer === "depositAccount";
        const accounts = isDeposit ? depositAccounts(kind) : withdrawSources(kind);
        const selected = isDeposit ? resolveDepositAccount(kind) : resolveWithdrawAccount(kind);
        drawerTitle.textContent = isDeposit ? t("交易账号", "Trading Account") : (isRegulatedWalletWithdraw(kind) || (isRegulatedTrader() && kind === "trader") ? t("取款来源", "Withdrawal Source") : t("交易账号", "Trading Account"));
        drawerList.innerHTML = accounts.map(([id, type, equity]) => `
          <button class="account-option ${selected === id ? "active" : ""}" type="button" data-select-${isDeposit ? "deposit" : "withdraw"}-account="${id}">
            <div><strong>${id}</strong><span>${type}</span></div>
            ${money(equity, isDeposit ? t("净值", "Equity") : t("可取", "Withdrawable"))}
          </button>
        `).join("");
        return;
      }

      if (drawer === "depositChannel") {
        const channels = depositChannels(appState.depositAmount);
        const selected = selectedDepositChannel(appState.depositAmount);
        drawerTitle.textContent = t("通道", "Channel");
        drawerList.innerHTML = channels.map(channel => `
          <button class="channel-card ${selected && selected.id === channel.id ? "active" : ""} ${channel.enabled ? "" : "disabled"}" type="button" data-select-deposit-channel="${channel.id}" ${channel.enabled ? "" : "aria-disabled=\"true\""}>
            <div><strong>${channel.name}</strong><span>${channel.currency} · $${channel.min.toLocaleString("en-US")} - $${channel.max.toLocaleString("en-US")}</span></div>
            ${channel.enabled ? badge(channel.requiresProof ? t("凭证", "Proof") : t("可选", "Available"), channel.requiresProof ? "amber" : "green") : badge(t("超限", "Blocked"), "gray")}
          </button>
        `).join("");
        return;
      }

      if (drawer === "withdrawMethod") {
        const methods = payoutMethods(kind);
        const selected = selectedPayoutMethod(kind);
        drawerTitle.textContent = isRegulatedWalletWithdraw(kind) ? t("本人收款账号", "Own Receiving Account") : t("收款方式", "Receiving Method");
        drawerList.innerHTML = methods.map(method => `
          <button class="channel-card ${selected[0] === method[0] ? "active" : ""}" type="button" data-select-withdraw-method="${method[0]}">
            <div><strong>${method[1]}</strong><span>${method[2]} · ${t("费用", "Fee")} ${method[3]} · ${method[4]}</span></div>
            ${badge(selected[0] === method[0] ? t("已选", "Selected") : t("可选", "Available"), selected[0] === method[0] ? "blue" : "green")}
          </button>
        `).join("");
        return;
      }

      if (drawer === "partnerTransferType") {
        const types = partnerTransferTypes();
        drawerTitle.textContent = t("选择转账类型", "Select Transfer Type");
        drawerList.innerHTML = types.map(([id, label]) => `
          <button class="account-option ${appState.scene === "transfer" && appState.transferType === id ? "active" : ""}" type="button" data-select-partner-transfer-type="${id}">
            <div><strong>${label}</strong><span>${id === "trading" ? t("自己或下级交易账号", "Own or referral trading account") : t("下级钱包", "Referral wallet")}</span></div>
            ${badge(appState.scene === "transfer" && appState.transferType === id ? t("已选", "Selected") : t("选择", "Select"), appState.scene === "transfer" && appState.transferType === id ? "blue" : "green")}
          </button>
        `).join("");
        return;
      }

      if (drawer === "overviewTransferType") {
        const types = overviewTransferTypes(kind);
        drawerTitle.textContent = t("选择转账类型", "Select Transfer Type");
        drawerList.innerHTML = types.map(([type, entry, scope, label, meta]) => `
          <button class="account-option" type="button" data-select-overview-transfer-type="${type}" data-transfer-entry="${entry}" data-transfer-scope="${scope}">
            <div><strong>${label}</strong><span>${meta}</span></div>
            ${badge(t("选择", "Select"), "green")}
          </button>
        `).join("");
        return;
      }

      if (drawer === "referralTarget") {
        const selected = selectedTransferDestination(kind);
        drawerTitle.textContent = t("Referral's UID or Email", "Referral's UID or Email");
        drawerList.innerHTML = `
          <input class="search-field" type="search" value="${escapeHtml(appState.subWalletSearch)}" placeholder="${appState.transferType === "trading" ? t("交易账号 / Referral UID 或 Email", "Trading account / Referral UID or Email") : t("Referral UID 或 Email", "Referral UID or Email")}" data-referral-target-search>
          ${referralTargetOptions(kind)}
        `;
        window.requestAnimationFrame(() => {
          const input = bottomDrawer.querySelector("[data-referral-target-search]");
          if (!input) return;
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        });
        return;
      }

      if (drawer === "transferFrom") {
        const accounts = transferSources(kind);
        const selected = selectedTransferSource(kind);
        drawerTitle.textContent = t("选择转出来源", "Select Source");
        drawerList.innerHTML = accounts.map(account => `
          <button class="account-option ${selected && selected[0] === account[0] ? "active" : ""}" type="button" data-select-transfer-from="${account[0]}">
            <div><strong>${account[0]}</strong><span>${account[1]}</span></div>
            ${money(account[2], t("可用", "Available"))}
          </button>
        `).join("");
        return;
      }

      if (drawer === "transferTo") {
        const destinations = transferDestinations(kind);
        const selected = selectedTransferDestination(kind);
        drawerTitle.textContent = t("选择去向", "Select Destination");
        if (!destinations.length) {
          drawerList.innerHTML = `
            <div class="review-panel">
              <div class="row"><span>${t("可选目标", "Available Targets")}</span><strong>0</strong></div>
              <div class="row"><span>${t("提示", "Hint")}</span><strong>${t("需至少 2 个交易账号", "At least 2 trading accounts required")}</strong></div>
            </div>
          `;
          return;
        }
        drawerList.innerHTML = destinations.map(destination => `
          <button class="account-option ${selected && selected[0] === destination[0] ? "active" : ""}" type="button" data-select-transfer-to="${destination[0]}">
            <div><strong>${destination[0]}</strong><span>${destination[1]}</span></div>
            ${money(destination[2], t("可用", "Available"))}
          </button>
        `).join("");
      }
    }

    function renderToast() {
      toast.textContent = appState.toast;
      toast.classList.toggle("show", Boolean(appState.toast));
    }

    function showToast(message) {
      appState.toast = message;
      renderToast();
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => {
        appState.toast = "";
        renderToast();
      }, 1800);
    }

    function resetDepositStep() {
      appState.depositStep = 1;
      appState.depositProof = false;
    }

    function submitCurrentFlow() {
      const kind = roleKind();
      if (appState.scene === "deposit") {
        const channel = selectedDepositChannel(appState.depositAmount);
        if (!resolveDepositAccount(kind) || !channel) return;
        if (channel.requiresProof && appState.depositStep === 1) {
          appState.depositStep = 2;
          appState.depositProof = false;
          renderScreen();
          showToast(t("上传转账凭证", "Upload transfer proof"));
          return;
        }
        if (channel.requiresProof && !appState.depositProof) return;
        showToast(t("存款申请已提交", "Deposit submitted"));
        return;
      }
      if (appState.scene === "withdraw") {
        if (!resolveWithdrawAccount(kind) || !selectedPayoutMethod(kind)) return;
        showToast(t("取款申请已提交", "Withdrawal submitted"));
        return;
      }
      if (appState.scene === "transfer") {
        if (isPublicTraderTransfer(kind) && !selectedTransferSource(kind)) return;
        if (!selectedTransferDestination(kind)) return;
        showToast(t("转账已完成", "Transfer completed"));
      }
    }

    function renderFlowAction() {
      let label = "";
      let disabled = false;
      const kind = roleKind();

      if (appState.scene === "deposit" && (appState.role === "client" || appState.role === "ib")) {
        const channel = selectedDepositChannel(appState.depositAmount);
        label = appState.exceptionMode === "reviewPending"
          ? t("复核中", "Under Review")
          : appState.depositStep === 2 ? t("提交凭证", "Submit Proof") : t("提交存款", "Submit Deposit");
        disabled = !resolveDepositAccount(kind) || !channel || (appState.depositStep === 2 && channel.requiresProof && !appState.depositProof);
      }

      if (appState.scene === "withdraw" && (appState.role === "client" || appState.role === "ib")) {
        label = appState.exceptionMode === "reviewPending" ? t("复核中", "Under Review") : t("确认取款", "Confirm Withdrawal");
        disabled = !resolveWithdrawAccount(kind);
      }

      if (appState.scene === "transfer" && (appState.role === "client" || appState.role === "ib")) {
        label = appState.exceptionMode === "reviewPending"
          ? t("复核中", "Under Review")
          : isPartnerReferralTransfer(kind) ? t("继续", "Continue") : t("立即转账", "Transfer Now");
        disabled = (isPublicTraderTransfer(kind) && !selectedTransferSource(kind)) || !selectedTransferDestination(kind);
      }

      disabled = disabled || exceptionBlocksSubmit(appState.scene);

      flowAction.classList.toggle("show", Boolean(label));
      flowAction.innerHTML = label ? `<button class="primary" type="button" data-submit-flow ${disabled ? "disabled" : ""}>${label}</button>` : "";
    }

    function renderScreen() {
      ensureScene();
      const role = roles[appState.role];
      const renderer = screens[appState.role][appState.scene] || screens[appState.role][role.scenes[0][0]];
      title.textContent = sceneName(appState.scene);
      roleChip.textContent = role.chip;
      screen.innerHTML = `${exceptionNotice(appState.scene)}${renderer()}`;
      renderTabbar();
      renderControls();
      renderFlowAction();
      renderDrawer();
      renderToast();
      lockHorizontalScroll();
    }

    roleSelect.addEventListener("change", (event) => {
      appState.role = event.target.value;
      appState.depositEntry = "home";
      appState.depositAccount = null;
      resetDepositStep();
      appState.withdrawEntry = "home";
      appState.withdrawAccount = null;
      resetTransfer(isRegulatedTrader() ? "accountToAccount" : "trading", isRegulatedTrader() ? "tradeAccount" : "wallet");
      appState.activeDrawer = null;
      ensureScene();
      renderScreen();
    });

    platformSelect.addEventListener("change", (event) => {
      appState.platform = event.target.value;
      appState.activeDrawer = null;
      renderScreen();
    });

    sceneSelect.addEventListener("change", (event) => {
      appState.scene = event.target.value;
      if (appState.scene === "deposit") {
        appState.depositEntry = "home";
        appState.depositAccount = null;
        resetDepositStep();
      }
      if (appState.scene === "withdraw") {
        appState.withdrawEntry = "home";
        appState.withdrawAccount = null;
      }
      appState.activeDrawer = null;
      renderScreen();
    });

    languageSelect.addEventListener("change", (event) => {
      appState.lang = event.target.value;
      renderScreen();
    });

    themeSelect.addEventListener("change", (event) => {
      appState.theme = event.target.value;
      renderScreen();
    });

    regulatoryModeSelect.addEventListener("change", (event) => {
      appState.regulatoryMode = event.target.value;
      appState.depositEntry = "home";
      appState.depositAccount = null;
      resetDepositStep();
      appState.withdrawEntry = "home";
      appState.withdrawAccount = null;
      resetTransfer(isRegulatedTrader() ? "accountToAccount" : "trading", isRegulatedTrader() ? "tradeAccount" : "wallet");
      appState.activeDrawer = null;
      renderScreen();
    });

    accountModeSelect.addEventListener("change", (event) => {
      appState.accountMode = event.target.value;
      appState.depositAccount = null;
      resetDepositStep();
      appState.withdrawAccount = null;
      renderScreen();
    });

    exceptionModeSelect.addEventListener("change", (event) => {
      appState.exceptionMode = event.target.value;
      appState.activeDrawer = null;
      renderScreen();
    });

    roleButtons.addEventListener("click", (event) => {
      const button = event.target.closest("[data-role]");
      if (!button) return;
      appState.role = button.dataset.role;
      appState.depositEntry = "home";
      appState.depositAccount = null;
      resetDepositStep();
      appState.withdrawEntry = "home";
      appState.withdrawAccount = null;
      resetTransfer(isRegulatedTrader() ? "accountToAccount" : "trading", isRegulatedTrader() ? "tradeAccount" : "wallet");
      appState.activeDrawer = null;
      ensureScene();
      renderScreen();
    });

    tabbar.addEventListener("click", (event) => {
      const button = event.target.closest("[data-tab]");
      if (!button) return;
      appState.scene = button.dataset.tab;
      if (appState.scene !== "deposit") {
        appState.depositEntry = appState.scene === "tradeAccount" ? "tradeAccount" : "home";
        resetDepositStep();
      }
      if (appState.scene !== "withdraw") {
        appState.withdrawEntry = appState.scene === "tradeAccount" ? "tradeAccount" : "home";
      }
      appState.activeDrawer = null;
      renderScreen();
    });

    screen.addEventListener("scroll", () => {
      if (screen.scrollLeft) screen.scrollLeft = 0;
    });

    bottomDrawer.addEventListener("input", (event) => {
      const searchInput = event.target.closest("[data-referral-target-search]");
      if (!searchInput) return;
      appState.subWalletSearch = searchInput.value;
      appState.transferTo = null;
      renderDrawer();
    });

    screen.addEventListener("click", (event) => {
      const drawerButton = event.target.closest("[data-open-drawer]");
      if (drawerButton) {
        if (drawerButton.getAttribute("aria-disabled") === "true") return;
        appState.activeDrawer = drawerButton.dataset.openDrawer;
        renderDrawer();
        return;
      }

      const amountButton = event.target.closest("[data-amount]");
      if (amountButton) {
        appState.depositAmount = Number(amountButton.dataset.amount);
        resetDepositStep();
        renderScreen();
        return;
      }

      const uploadProofButton = event.target.closest("[data-upload-proof]");
      if (uploadProofButton) {
        appState.depositProof = true;
        renderScreen();
        showToast(t("凭证已选择", "Proof selected"));
        return;
      }

      const withdrawAmountButton = event.target.closest("[data-withdraw-amount]");
      if (withdrawAmountButton) {
        appState.withdrawAmount = Number(withdrawAmountButton.dataset.withdrawAmount);
        renderScreen();
        return;
      }

      const transferAmountButton = event.target.closest("[data-transfer-amount]");
      if (transferAmountButton) {
        appState.transferAmount = Number(transferAmountButton.dataset.transferAmount);
        renderScreen();
        return;
      }

      const transferTypeButton = event.target.closest("[data-transfer-type]");
      if (transferTypeButton && !transferTypeButton.hasAttribute("data-jump")) {
        const nextType = transferTypeButton.dataset.transferType;
        resetTransfer(nextType, nextType === "accountToAccount" ? "tradeAccount" : "wallet");
        renderScreen();
        return;
      }

      const inlineTransferTo = event.target.closest("[data-select-transfer-to]");
      if (inlineTransferTo) {
        appState.transferTo = inlineTransferTo.dataset.selectTransferTo;
        renderScreen();
        return;
      }

      const accountButton = event.target.closest("[data-account]");
      if (accountButton) {
        appState.depositAccount = accountButton.dataset.account;
        renderScreen();
        return;
      }

      const withdrawAccountButton = event.target.closest("[data-withdraw-account]");
      if (withdrawAccountButton) {
        appState.withdrawAccount = withdrawAccountButton.dataset.withdrawAccount;
        renderScreen();
        return;
      }

      const button = event.target.closest("[data-jump]");
      if (!button) return;
      if (button.getAttribute("aria-disabled") === "true") {
        showToast(t("需至少 2 个交易账号", "At least 2 trading accounts required"));
        return;
      }
      appState.scene = button.dataset.jump;
      if (appState.scene === "deposit") {
        appState.depositEntry = button.dataset.entry || "home";
        appState.depositAccount = appState.depositEntry === "tradeAccount" ? (button.dataset.accountId || "MT5-204882") : null;
        resetDepositStep();
      }
      if (appState.scene === "withdraw") {
        appState.withdrawEntry = button.dataset.entry || "home";
        if (appState.withdrawEntry === "tradeAccount") {
          appState.withdrawAccount = button.dataset.accountId || "MT5-204882";
        } else if (appState.withdrawEntry === "wallet") {
          appState.withdrawAccount = walletSource(roleKind())[0];
        } else {
          appState.withdrawAccount = null;
        }
      }
      if (appState.scene === "transfer") {
        const nextType = button.dataset.transferType || (isRegulatedTrader() ? "accountToAccount" : "trading");
        const nextEntry = button.dataset.transferEntry || (nextType === "accountToAccount" ? "tradeAccount" : "wallet");
        resetTransfer(nextType, nextEntry);
      }
      renderScreen();
    });

    drawerBackdrop.addEventListener("click", closeDrawer);

    bottomDrawer.addEventListener("click", (event) => {
      if (event.target.closest("[data-close-drawer]")) {
        closeDrawer();
        return;
      }

      const depositAccount = event.target.closest("[data-select-deposit-account]");
      if (depositAccount) {
        appState.depositAccount = depositAccount.dataset.selectDepositAccount;
        resetDepositStep();
        appState.activeDrawer = null;
        renderScreen();
        return;
      }

      const withdrawAccount = event.target.closest("[data-select-withdraw-account]");
      if (withdrawAccount) {
        appState.withdrawAccount = withdrawAccount.dataset.selectWithdrawAccount;
        appState.activeDrawer = null;
        renderScreen();
        return;
      }

      const depositChannel = event.target.closest("[data-select-deposit-channel]");
      if (depositChannel) {
        if (depositChannel.getAttribute("aria-disabled") === "true") return;
        appState.depositChannel = depositChannel.dataset.selectDepositChannel;
        resetDepositStep();
        appState.activeDrawer = null;
        renderScreen();
        return;
      }

      const withdrawMethod = event.target.closest("[data-select-withdraw-method]");
      if (withdrawMethod) {
        appState.withdrawMethod = withdrawMethod.dataset.selectWithdrawMethod;
        appState.activeDrawer = null;
        renderScreen();
        return;
      }

      const partnerTransferType = event.target.closest("[data-select-partner-transfer-type]");
      if (partnerTransferType) {
        appState.scene = "transfer";
        resetTransfer(partnerTransferType.dataset.selectPartnerTransferType, "partnerTransfer", "all");
        appState.activeDrawer = null;
        renderScreen();
        return;
      }

      const overviewTransferType = event.target.closest("[data-select-overview-transfer-type]");
      if (overviewTransferType) {
        appState.scene = "transfer";
        resetTransfer(
          overviewTransferType.dataset.selectOverviewTransferType,
          overviewTransferType.dataset.transferEntry,
          overviewTransferType.dataset.transferScope
        );
        appState.activeDrawer = null;
        renderScreen();
        return;
      }

      const transferTo = event.target.closest("[data-select-transfer-to]");
      if (transferTo) {
        appState.transferTo = transferTo.dataset.selectTransferTo;
        appState.activeDrawer = null;
        renderScreen();
        return;
      }

      const transferFrom = event.target.closest("[data-select-transfer-from]");
      if (transferFrom) {
        appState.transferFrom = transferFrom.dataset.selectTransferFrom;
        appState.transferTo = null;
        appState.activeDrawer = null;
        renderScreen();
      }
    });

    flowAction.addEventListener("click", (event) => {
      const submitButton = event.target.closest("[data-submit-flow]");
      if (!submitButton || submitButton.disabled) return;
      submitCurrentFlow();
    });

    backButton.addEventListener("click", () => {
      if (appState.activeDrawer) {
        closeDrawer();
        return;
      }
      if (appState.scene === "deposit" && appState.depositStep === 2) {
        resetDepositStep();
        renderScreen();
        return;
      }
      if (appState.role === "client" || appState.role === "ib") {
        appState.scene = appState.scene === "overview" ? "records" : "overview";
      } else {
        appState.scene = roles[appState.role].tabs[0][0];
      }
      appState.depositEntry = "home";
      appState.withdrawEntry = "home";
      renderScreen();
    });

    messageButton.addEventListener("click", () => {
      showToast(t("暂无新的资金通知", "No new fund notices"));
    });

    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }

    renderScreen();
    window.scrollTo(0, 0);
  </script>
</body>
</html>
