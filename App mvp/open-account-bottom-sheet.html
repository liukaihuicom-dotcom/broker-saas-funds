<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Account Bottom Sheet</title>
  <style>
    :root {
      color-scheme: light;
      --page: oklch(96.5% 0.008 145);
      --phone: oklch(98.5% 0.006 145);
      --mask: rgba(0, 0, 0, .5);
      --sheet: oklch(99% 0.004 145);
      --surface: oklch(99% 0.004 145);
      --surface-raised: oklch(97.6% 0.006 145);
      --ink: oklch(24% 0.012 145);
      --sub: oklch(46% 0.012 145);
      --muted: oklch(58% 0.012 145);
      --soft: oklch(96% 0.007 145);
      --line: oklch(89% 0.01 145);
      --line-strong: rgba(0, 0, 0, .2);
      --action: oklch(86% 0.19 132);
      --action-ink: oklch(23% 0.08 135);
      --accent: oklch(81% 0.11 195);
      --success: oklch(47% 0.13 155);
      --warning: oklch(58% 0.11 75);
      --danger: oklch(54% 0.19 25);
      --info: oklch(50% 0.16 255);
      --info-bg: oklch(96.5% 0.018 255);
      --success-bg: oklch(96.5% 0.02 155);
      --warning-bg: oklch(96.5% 0.032 78);
      --error-bg: oklch(96.5% 0.026 25);
      --airbnb-rausch: #ff385c;
      --airbnb-rausch-active: #e00b41;
      --airbnb-ink: oklch(24% 0.006 70);
      --airbnb-body: oklch(36% 0.006 70);
      --airbnb-muted: oklch(51% 0.006 70);
      --airbnb-line: oklch(88% 0.004 70);
      --airbnb-soft: oklch(97.5% 0.004 70);
      --airbnb-rose-soft: oklch(97% 0.018 18);
      --radius-sheet: 24px;
      --radius-control: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      letter-spacing: 0;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 24px;
    }

    .phone {
      position: relative;
      width: min(390px, calc(100vw - 24px));
      height: min(844px, calc(100vh - 56px));
      min-height: 700px;
      overflow: hidden;
      border-radius: 30px;
      background: var(--surface-raised);
      box-shadow: 0 22px 70px rgba(24, 31, 42, .22);
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .42), rgba(255, 255, 255, 0) 28%),
        radial-gradient(circle at 50% 24%, rgba(255, 255, 255, .52), transparent 26%);
    }

    .app-hint {
      position: absolute;
      inset: 48px 22px auto;
      z-index: 1;
      color: rgba(30, 35, 43, .28);
      font-size: 18px;
      font-weight: 760;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .mask {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: var(--mask);
    }

    .mask[data-mode="page"] {
      align-items: stretch;
      background: var(--phone);
    }

    .sheet {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
      background: var(--sheet);
      animation: rise .32s cubic-bezier(.2, .8, .2, 1);
      display: flex;
      flex-direction: column;
    }

    .mask[data-mode="page"] .sheet {
      height: 100%;
      max-height: none;
      border-radius: 0;
      background: var(--phone);
      animation: none;
    }

    @keyframes rise {
      from {
        transform: translateY(26px);
        opacity: .85;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .sheet-top {
      height: 24px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
    }

    .mask[data-mode="page"] .sheet-top {
      display: none;
    }

    .handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: var(--line-strong);
    }

    .page-nav {
      height: 90px;
      flex: 0 0 auto;
      padding: 50px 16px 0;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 40px;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      background: var(--phone);
    }

    .page-nav[hidden] {
      display: none;
    }

    .page-nav button {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
      font-weight: 520;
    }

    .page-nav span {
      min-width: 0;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.2;
      font-weight: 720;
      text-align: center;
    }

    .sheet-content {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 22px 16px 18px;
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .mask[data-mode="page"] .sheet-content {
      flex: 1 1 auto;
      padding: 22px 20px 20px;
      align-content: start;
      justify-items: stretch;
      gap: 14px;
    }

    .visual {
      width: 160px;
      height: 80px;
      display: grid;
      place-items: center;
    }

    .visual svg {
      width: 124px;
      height: 82px;
      overflow: visible;
    }

    .mask[data-mode="page"] .visual {
      justify-self: start;
      width: 72px;
      height: 72px;
      border: 1px solid color-mix(in oklch, var(--accent) 20%, var(--line));
      border-radius: 22px;
      background: color-mix(in oklch, var(--accent) 10%, var(--surface));
      overflow: visible;
    }

    .mask[data-mode="page"] .visual svg {
      width: 80px;
      height: 54px;
      transform: none;
    }

    .mask[data-mode="page"] .visual svg > path:first-child,
    .mask[data-mode="page"] .visual svg > path:last-child {
      display: none;
    }

    .visual [data-accent] {
      fill: var(--accent);
    }

    .visual [data-stroke] {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mask[data-mode="page"] .sheet[data-node="account_init"][data-demo-state="done"] .visual,
    .mask[data-mode="page"] .sheet[data-node="account_approved"][data-demo-state="done"] .visual {
      border-color: color-mix(in oklch, var(--success) 24%, var(--line));
      background: color-mix(in oklch, var(--success-bg) 70%, var(--surface));
    }

    .mask[data-mode="page"] .sheet[data-node="account_init"][data-demo-state="done"] .visual [data-accent],
    .mask[data-mode="page"] .sheet[data-node="account_approved"][data-demo-state="done"] .visual [data-accent] {
      fill: color-mix(in oklch, var(--success) 32%, var(--accent));
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"][data-demo-state="pending"] .visual,
    .mask[data-mode="page"] .sheet[data-node="account_approved"][data-demo-state="pending"] .visual {
      border-color: color-mix(in oklch, var(--warning) 26%, var(--line));
      background: color-mix(in oklch, var(--warning-bg) 72%, var(--surface));
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"][data-demo-state="pending"] .visual [data-accent],
    .mask[data-mode="page"] .sheet[data-node="account_approved"][data-demo-state="pending"] .visual [data-accent] {
      fill: color-mix(in oklch, var(--warning) 34%, var(--accent));
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"][data-demo-state="done"] .visual {
      border-color: color-mix(in oklch, var(--info) 22%, var(--line));
      background: color-mix(in oklch, var(--info-bg) 78%, var(--surface));
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"][data-demo-state="done"] .visual [data-accent] {
      fill: color-mix(in oklch, var(--info) 28%, var(--accent));
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .visual {
      border-color: color-mix(in oklch, var(--airbnb-rausch) 22%, var(--airbnb-line));
      border-radius: 20px;
      background: color-mix(in oklch, var(--airbnb-rose-soft) 78%, var(--surface));
      box-shadow: 0 10px 24px rgba(34, 34, 34, .06);
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .visual [data-accent] {
      fill: color-mix(in oklch, var(--airbnb-rausch) 36%, var(--success));
    }

    .mask[data-mode="page"] .sheet[data-node="account_failed"] .visual {
      border-color: color-mix(in oklch, var(--danger) 24%, var(--line));
      background: color-mix(in oklch, var(--error-bg) 72%, var(--surface));
    }

    .mask[data-mode="page"] .sheet[data-node="account_failed"] .visual [data-accent] {
      fill: color-mix(in oklch, var(--danger) 32%, var(--accent));
    }

    .mask[data-mode="page"] .sheet[data-node="video_reviewing"] .visual,
    .mask[data-mode="page"] .sheet[data-node="video_application_waiting"] .visual {
      border-color: color-mix(in oklch, var(--info) 22%, var(--line));
      background: color-mix(in oklch, var(--info-bg) 78%, var(--surface));
    }

    .mask[data-mode="page"] .sheet[data-node="video_reviewing"] .visual [data-accent],
    .mask[data-mode="page"] .sheet[data-node="video_application_waiting"] .visual [data-accent] {
      fill: color-mix(in oklch, var(--info) 28%, var(--accent));
    }

    .mask[data-mode="page"] .sheet[data-node="video_completed"] .visual {
      border-color: color-mix(in oklch, var(--success) 24%, var(--line));
      background: color-mix(in oklch, var(--success-bg) 72%, var(--surface));
    }

    .mask[data-mode="page"] .sheet[data-node="video_completed"] .visual [data-accent] {
      fill: color-mix(in oklch, var(--success) 34%, var(--accent));
    }

    .mask[data-mode="page"] .sheet[data-node="video_failed"] .visual {
      border-color: color-mix(in oklch, var(--danger) 24%, var(--line));
      background: color-mix(in oklch, var(--error-bg) 72%, var(--surface));
    }

    .mask[data-mode="page"] .sheet[data-node="video_failed"] .visual [data-accent] {
      fill: color-mix(in oklch, var(--danger) 32%, var(--accent));
    }

    .copy {
      width: 100%;
      display: grid;
      gap: 8px;
      text-align: center;
    }

    .mask[data-mode="page"] .copy {
      gap: 10px;
      text-align: left;
    }

    .copy h1 {
      margin: 0;
      color: var(--ink);
      font-size: 24px;
      line-height: 1.16;
      font-weight: 720;
    }

    .mask[data-mode="page"] .copy h1 {
      font-size: 27px;
      line-height: 1.14;
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .copy h1 {
      color: var(--airbnb-ink);
      font-size: 26px;
      line-height: 1.18;
      font-weight: 720;
    }

    .copy p {
      margin: 0 auto;
      max-width: 330px;
      color: var(--ink);
      font-size: 16px;
      line-height: 19.2px;
      font-weight: 400;
    }

    .mask[data-mode="page"] .copy p {
      margin: 0;
      max-width: none;
      color: var(--sub);
      line-height: 1.45;
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .copy p {
      color: var(--airbnb-body);
      font-size: 16px;
      line-height: 1.42;
      font-weight: 430;
    }

    .reason-note {
      width: min(330px, 100%);
      margin: 4px auto 0;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--info-bg);
      color: var(--info);
      font-size: 13px;
      line-height: 1.42;
      font-weight: 520;
      text-align: left;
    }

    .mask[data-mode="page"] .reason-note,
    .mask[data-mode="page"] .tips-card,
    .mask[data-mode="page"] .info-card,
    .mask[data-mode="page"] .account-card {
      width: 100%;
    }

    .mask[data-mode="page"] .reason-note {
      margin-top: 2px;
      padding: 10px 13px;
      border-radius: 14px;
      line-height: 1.45;
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .reason-note {
      border-color: color-mix(in oklch, var(--airbnb-rausch) 20%, var(--airbnb-line));
      border-radius: 16px;
      background: color-mix(in oklch, var(--airbnb-rose-soft) 82%, var(--surface));
      color: color-mix(in oklch, var(--airbnb-rausch-active) 76%, var(--airbnb-ink));
      font-weight: 650;
    }

    .reason-note[data-level="warning"] {
      border-color: color-mix(in oklch, var(--warning) 24%, var(--line));
      background: var(--warning-bg);
      color: var(--warning);
    }

    .reason-note[data-level="error"] {
      border-color: color-mix(in oklch, var(--danger) 24%, var(--line));
      background: var(--error-bg);
      color: var(--danger);
    }

    .reason-note[hidden] {
      display: none;
    }

    .tips-card {
      width: min(330px, 100%);
      margin: 6px auto 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: var(--surface);
      display: grid;
      gap: 9px;
      text-align: left;
    }

    .tips-card[hidden] {
      display: none;
    }

    .tips-card ul {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tips-card li {
      position: relative;
      padding-left: 18px;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.38;
      font-weight: 540;
    }

    .tips-card li::before {
      content: "";
      position: absolute;
      left: 0;
      top: .56em;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in oklch, var(--accent) 22%, transparent);
    }

    .tips-card button {
      width: max-content;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--info);
      font-size: 13px;
      font-weight: 680;
      text-align: left;
    }

    .info-card {
      width: min(330px, 100%);
      margin: 6px auto 0;
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .info-card[hidden] {
      display: none;
    }

    .info-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: var(--surface);
      display: grid;
      gap: 7px;
    }

    .mask[data-mode="page"] .info-card {
      gap: 10px;
    }

    .mask[data-mode="page"] .info-item {
      border-radius: 16px;
      padding: 14px;
    }

    .info-item strong {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.3;
      font-weight: 720;
    }

    .info-item span {
      color: var(--sub);
      font-size: 12px;
      line-height: 1.42;
      font-weight: 520;
    }

    .info-item ul {
      display: grid;
      gap: 6px;
      margin: 2px 0 0;
      padding: 0;
      list-style: none;
    }

    .info-item li {
      position: relative;
      padding-left: 18px;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.38;
      font-weight: 540;
    }

    .info-item li::before {
      content: "✓";
      position: absolute;
      left: 0;
      top: 0;
      color: var(--success);
      font-weight: 820;
    }

    .info-item[data-kind="summary"] {
      border-color: color-mix(in oklch, var(--action) 38%, var(--line));
      background: color-mix(in oklch, var(--action) 12%, var(--surface));
    }

    .info-item[data-kind="summary"] strong {
      font-size: 15px;
    }

    .info-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .info-tag {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      border: 1px solid color-mix(in oklch, var(--action) 26%, var(--line));
      border-radius: 999px;
      padding: 4px 8px;
      background: color-mix(in oklch, var(--surface) 72%, transparent);
      color: var(--action-ink);
      font-size: 11px;
      line-height: 1;
      font-weight: 720;
    }

    .status-steps {
      display: grid;
      margin-top: 2px;
    }

    .status-step {
      position: relative;
      min-height: 31px;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      padding-bottom: 6px;
    }

    .status-step:last-child {
      min-height: 22px;
      padding-bottom: 0;
    }

    .status-step::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 19px;
      bottom: 0;
      width: 1px;
      background: color-mix(in oklch, var(--line) 88%, transparent);
    }

    .status-step:last-child::after {
      display: none;
    }

    .status-dot {
      position: relative;
      z-index: 1;
      width: 17px;
      height: 17px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--surface);
      font-size: 11px;
      line-height: 1;
      font-weight: 820;
    }

    .status-step[data-state="done"] .status-dot {
      border-color: color-mix(in oklch, var(--success) 72%, var(--line));
      background: var(--success);
    }

    .status-step[data-state="done"] .status-dot::before {
      content: "✓";
    }

    .status-step[data-state="current"] .status-dot {
      border-color: color-mix(in oklch, var(--action) 72%, var(--line));
      background: var(--action);
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--action) 18%, transparent);
    }

    .status-step[data-state="pending"] .status-dot {
      background: var(--surface);
    }

    .status-step-content {
      display: grid;
      gap: 2px;
      transform: translateY(-1px);
    }

    .status-step-content b {
      color: var(--ink);
      font-size: 13px;
      line-height: 1.25;
      font-weight: 720;
    }

    .status-step-content small {
      color: var(--sub);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 520;
    }

    .info-item[data-kind="status"] {
      border-color: color-mix(in oklch, var(--action) 30%, var(--line));
      background: color-mix(in oklch, var(--action) 7%, var(--surface));
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .info-item {
      border-color: var(--airbnb-line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 1px 0 rgba(34, 34, 34, .04);
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .info-item strong {
      color: var(--airbnb-ink);
      font-weight: 680;
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .info-item span,
    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .status-step-content small {
      color: var(--airbnb-muted);
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .info-item[data-kind="status"] {
      border-color: color-mix(in oklch, var(--airbnb-rausch) 18%, var(--airbnb-line));
      background:
        linear-gradient(180deg, color-mix(in oklch, var(--airbnb-rose-soft) 56%, var(--surface)), var(--surface) 64%);
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .info-item[data-kind="action"] {
      border-color: color-mix(in oklch, var(--success) 18%, var(--airbnb-line));
      background: color-mix(in oklch, var(--success-bg) 55%, var(--surface));
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .status-step::after {
      background: var(--airbnb-line);
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .status-step[data-state="done"] .status-dot {
      border-color: color-mix(in oklch, var(--success) 62%, var(--airbnb-line));
      background: var(--success);
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .status-step[data-state="current"] .status-dot {
      border-color: color-mix(in oklch, var(--airbnb-rausch) 72%, var(--airbnb-line));
      background: var(--airbnb-rausch);
      box-shadow: 0 0 0 5px color-mix(in oklch, var(--airbnb-rausch) 14%, transparent);
    }

    .mask[data-mode="page"] .sheet[data-node="account_reviewing"] .status-step[data-state="pending"] .status-dot {
      border-color: var(--airbnb-line);
      background: var(--surface);
    }

    .info-item[data-kind="confirm"] li {
      color: var(--ink);
    }

    .info-item[data-kind="prepare"] ul {
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .info-item[data-kind="prepare"] li {
      min-height: 36px;
      display: flex;
      align-items: center;
      border-radius: 10px;
      padding: 8px 8px 8px 24px;
      background: var(--soft);
      color: var(--ink);
    }

    .info-item[data-kind="prepare"] li::before {
      top: 50%;
      left: 8px;
      transform: translateY(-50%);
    }

              body: text("在开户或部分账户操作前，平台需要确认您的身份、账户申请意愿和相关风险声明。", "Before account opening or certain account actions, the platform needs to confirm your identity, application intent, and related risk acknowledgement."),
              tags: [
                text("监管要求", "Regulatory requirement"),
                text("账户安全", "Account security")
              ]
            },
            {
              kind: "confirm",
              title: text("认证会确认什么", "What We Confirm"),
              items: [
                text("是否由账户本人完成认证", "The account holder completes the verification"),
                text("人脸是否与身份资料一致", "The face matches the identity information"),
                text("是否按页面内容完成朗读", "The statement is read as shown"),
                text("是否确认账户申请和使用意愿", "Account application and usage intent are confirmed")
              ]
            },
            {
              kind: "prepare",
              title: text("认证前请准备", "Before You Start"),
              items: [
                text("本人单独入镜", "Only you appear in the video"),
                text("光线充足", "A well-lit environment"),
                text("清晰朗读", "Read clearly"),
                text("网络稳定", "A stable network connection")
              ]
            },
            {
              kind: "impact",
              title: text("未完成认证会影响什么", "What Happens If Verification Is Not Completed"),
              body: text("认证完成前，部分功能可能暂时不可用。存款可先提交但资金会保持待处理；新增交易账号、取款等操作需认证通过后继续。", "Until verification is completed, some features may be temporarily unavailable. Deposits can be submitted but remain pending; adding trading accounts or withdrawals can continue after approval.")
            },
            {
              kind: "privacy",
              title: text("我们如何使用您的视频资料", "How We Use Your Video Information"),
              body: text("您的视频资料仅用于身份确认、账户申请确认、合规审核及账户安全目的。", "Your video information is used only for identity confirmation, account application confirmation, compliance review, and account security purposes.")
            }
          ],
          primary: text("开始视频认证", "Start Video Verification"),
          secondary: text("返回", "Back")
        },
        video_required: videoRequiredData(),
        video_reviewing: videoReviewingData(),
        video_application_waiting: {
          icon: "review",
          title: text("开户流程等待认证结果", "Application Waiting for Verification"),
          desc: text("您的视频认证已提交。认证通过后，开户流程将继续处理。", "Your video verification has been submitted. Your application will continue once verification is approved."),
          error: text("当前无需重复提交开户资料，请等待视频认证结果。", "You do not need to submit your application again. Please wait for the video verification result."),
          noticeLevel: "info",
          info: [
            {
              kind: "status",
              title: text("当前处理状态", "Current Status"),
              steps: [
                {
                  state: "done",
                  label: text("视频认证已提交", "Video verification submitted"),
                  meta: text("我们已收到您的认证视频。", "We’ve received your verification video.")
                },
                {
                  state: "current",
                  label: text("等待认证结果", "Waiting for verification result"),
                  meta: text("认证通过后，开户流程将继续处理。", "Your application will continue after verification is approved.")
                },
                {
                  state: "pending",
                  label: text("继续开户流程", "Continue application"),
                  meta: text("后续结果会通过 App 通知您。", "We’ll notify you in the app about the next result.")
                }
              ]
            }
          ],
          primary: text("查看开户进度", "View Application Status"),
          secondary: text("返回首页", "Back to Home"),
          triggerScene: "application"
        },
        video_completed: videoCompletedData(),
        video_failed: {
          icon: "failed",
          title: text("视频认证未通过", "Video Verification Not Approved"),
          desc: text("本次视频认证暂未通过。请按页面录制要求重新提交，或联系客服协助处理。", "This video verification was not approved. Please follow the recording instructions and submit again, or contact support for help."),
          error: text("重新录制时，请确保本人单独入镜、面部清晰，并按页面提示完整完成认证。", "When recording again, make sure only you appear, your face is clear, and the verification is completed as instructed."),
          noticeLevel: "error",
          info: [
            {
              kind: "fix",
              title: text("重新录制前请检查", "Before Recording Again"),
              items: [
                text("确保只有本人出现在画面中", "Make sure only you appear in the video"),
                text("保持光线充足，面部完整清晰", "Use good lighting and keep your full face clear"),
                text("按页面文字完整、清晰朗读", "Read the on-screen statement completely and clearly")
              ]
            },
            {
              kind: "action",
              title: text("如果仍无法通过", "If It Still Fails"),
              body: text("您可以联系客服协助查看。认证通过前，受影响的账户操作可能暂时无法继续。", "You can contact support for help. Affected account actions may remain unavailable until verification is approved.")
            }
          ],
          primary: text("重新录制", "Record Again"),
          secondary: text("联系客服", "Contact Support")
        }
      };

      const current = data[state.node];
      return {
        ...current,
        noticeLevel: current.noticeLevel || noticeLevelForNode(state.node, demoDone)
      };
    }

    function iconSvg(type) {
      const middle = {
        open: '<path data-accent d="M42 28c0-12 9.7-21.8 21.7-21.8s21.7 9.8 21.7 21.8v7.3l10.2 10.3H70.8c-2.3.8-4.7 1.2-7.1 1.2C51.7 46.8 42 40 42 28Z"/><circle data-stroke cx="64" cy="23" r="7.8"/><path data-stroke d="M50.5 43.5c1.8-8 6.4-12 13.3-12 4.9 0 8.6 1.8 11.1 5.3"/><path data-stroke d="M79.5 33.5v16M71.5 41.5h16"/>',
        video: '<path data-accent d="M38 18h44a11 11 0 0 1 11 11v24a11 11 0 0 1-11 11H38a11 11 0 0 1-11-11V29a11 11 0 0 1 11-11Z"/><path data-stroke d="M38 18h44a11 11 0 0 1 11 11v24a11 11 0 0 1-11 11H38a11 11 0 0 1-11-11V29a11 11 0 0 1 11-11Z"/><path data-stroke d="M93 34l18-10v34L93 48"/><circle data-stroke cx="59" cy="34" r="7"/><path data-stroke d="M45 54c2.5-7.5 7.2-11.2 14-11.2s11.5 3.7 14 11.2"/>',
        demo: '<path data-accent d="M38 43.5c4.3-20.5 15.7-31 34.2-31 8.3 0 14.7 2 19.2 6v33h-53.4v-8Z"/><path data-stroke d="M46 45l12-13 9 8 17-20"/><path data-stroke d="M42 56.5h58"/><path data-stroke d="M42 24v32h58"/>',
        pause: '<path data-accent d="M42 18h46a10 10 0 0 1 10 10v20a10 10 0 0 1-10 10H42a10 10 0 0 1-10-10V28a10 10 0 0 1 10-10Z"/><path data-stroke d="M58 30v17M75 30v17"/><path data-stroke d="M35 62h60"/>',
        review: '<path data-accent d="M45 11h38l13 13v37H45z"/><path data-stroke d="M45 11h38l13 13v37H45z"/><path data-stroke d="M81 12v14h14"/><path data-stroke d="M55 35h30M55 46h22"/><circle data-stroke cx="88" cy="58" r="12"/><path data-stroke d="M97 67l8 8"/>',
        success: '<circle data-accent cx="68" cy="36" r="28"/><circle data-stroke cx="68" cy="36" r="28"/><path data-stroke d="M54 36l10 10 20-22"/><path data-stroke d="M35 70h66"/>',
        failed: '<circle data-accent cx="68" cy="36" r="28"/><circle data-stroke cx="68" cy="36" r="28"/><path data-stroke d="M57 25l22 22M79 25 57 47"/><path data-stroke d="M35 70h66"/>'
      }[type];

      return `
        <svg viewBox="0 0 136 82" role="img">
          <path data-stroke d="M25 18c-8 10-8 28 0 38M17 10c-13 17-13 43 0 60" opacity=".9"/>
          ${middle}
          <path data-stroke d="M111 18c8 10 8 28 0 38M119 10c13 17 13 43 0 60" opacity=".9"/>
        </svg>
      `;
    }

    function render() {
      normalizeNode();
      const data = nodeData();
      const lang = state.lang;
      const names = nodeNameMap();
      const isAccountPage = state.flowType === "account";
      const isVideoPage = state.flowType === "video" && videoPageNodes.has(state.node);
      const isPageMode = isAccountPage || isVideoPage;

      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.querySelector(".mask").dataset.mode = isPageMode ? "page" : "sheet";
      const sheet = document.querySelector(".sheet");
      sheet.dataset.node = state.node;
      sheet.dataset.demoState = state.demoDone ? "done" : "pending";
      sheet.setAttribute("aria-label", isPageMode ? "Feedback page" : "Open account bottom sheet");
      const pageNav = document.querySelector("#pageNav");
      pageNav.hidden = !isPageMode;
      document.querySelector("#pageNavTitle").textContent = isVideoPage ? labels[lang].videoPageTitle : labels[lang].accountPageTitle;
      document.querySelector("#visual").innerHTML = iconSvg(data.icon);
      document.querySelector("#sheetTitle").textContent = data.title[lang];
      document.querySelector("#sheetDesc").textContent = data.desc[lang];
      const failureReason = document.querySelector("#failureReason");
      failureReason.textContent = data.error ? data.error[lang] : "";
      failureReason.dataset.level = data.noticeLevel || "info";
      if (data.error) {
        failureReason.setAttribute("role", data.noticeLevel === "error" ? "alert" : "status");
      } else {
        failureReason.removeAttribute("role");
      }
      failureReason.hidden = !data.error;
      const tipsCard = document.querySelector("#tipsCard");
      if (data.tips || data.help) {
        const tips = data.tips ? `<ul>${data.tips.map((tip) => `<li>${tip[lang]}</li>`).join("")}</ul>` : "";
        const help = data.help ? `<button type="button" data-help-video>${data.help[lang]}</button>` : "";
        tipsCard.innerHTML = `${tips}${help}`;
        tipsCard.hidden = false;
      } else {
        tipsCard.innerHTML = "";
        tipsCard.hidden = true;
      }
      const infoCard = document.querySelector("#infoCard");
      if (data.info) {
        infoCard.innerHTML = data.info.map((item) => `
          <div class="info-item" data-kind="${item.kind || "section"}">
            <strong>${item.title[lang]}</strong>
            ${item.body ? `<span>${item.body[lang]}</span>` : ""}
            ${item.tags ? `<div class="info-tags">${item.tags.map((entry) => `<span class="info-tag">${entry[lang]}</span>`).join("")}</div>` : ""}
            ${item.steps ? `<div class="status-steps">${item.steps.map((step) => `
              <div class="status-step" data-state="${step.state || "pending"}">
                <i class="status-dot" aria-hidden="true"></i>
                <div class="status-step-content">
                  <b>${step.label[lang]}</b>
                  ${step.meta ? `<small>${step.meta[lang]}</small>` : ""}
                </div>
              </div>
            `).join("")}</div>` : ""}
            ${item.items ? `<ul>${item.items.map((entry) => `<li>${entry[lang]}</li>`).join("")}</ul>` : ""}
          </div>
        `).join("");
        infoCard.hidden = false;
      } else {
        infoCard.innerHTML = "";
        infoCard.hidden = true;
      }
      const accountCard = document.querySelector("#accountCard");
      if (data.account) {
        const accountValue = (value) => typeof value === "string" ? value : value[lang];
        accountCard.innerHTML = `
          <div class="account-card-head">
            <div class="account-title">
            <span>${data.account.label[lang]}</span>
              <strong class="account-number">${data.account.number}</strong>
            </div>
            <em>${data.account.status[lang]}</em>
          </div>
          <div class="account-balance">
            <span>${data.account.balanceLabel[lang]}</span>
            <strong>${data.account.balance}</strong>
          </div>
          <div class="account-details">
            ${data.account.details.map((item) => `
              <div class="account-detail">
                <span>${item.label[lang]}</span>
                <strong>${accountValue(item.value)}</strong>
              </div>
            `).join("")}
          </div>
          <small>${data.account.note[lang]}</small>
        `;
        accountCard.hidden = false;
      } else {
        accountCard.innerHTML = "";
        accountCard.hidden = true;
      }

      document.querySelector("#primaryAction").innerHTML = `${data.primary[lang]}<span>→</span>`;
      const secondaryAction = document.querySelector("#secondaryAction");
      secondaryAction.textContent = data.secondary ? data.secondary[lang] : "";
      secondaryAction.hidden = !data.secondary;

      document.querySelector("#panelTitle").textContent = labels[lang].panelTitle;
      document.querySelector("#flowLabel").textContent = labels[lang].flowLabel;
      document.querySelector("#nodeLabel").textContent = labels[lang].nodeLabel;
      document.querySelector("#demoLabel").textContent = labels[lang].demoLabel;
      document.querySelector("#langLabel").textContent = labels[lang].langLabel;
      document.querySelector("#panelSummary").textContent = `${currentFlow().label[lang]} / ${names[state.node][lang]}`;

      document.querySelector("#flowSwitch").innerHTML = Object.entries(flows)
        .map(([id, flow]) => `<button type="button" data-flow="${id}" class="${id === state.flowType ? "active" : ""}">${flow.label[lang]}</button>`)
        .join("");

      const showAccountScene = state.flowType === "account" && state.node === "account_init";
      const showVideoScene = state.flowType === "video" && sceneAwareVideoNodes.has(state.node);
      document.querySelector("#demoField").hidden = state.flowType !== "account";
      document.querySelector("#triggerSceneField").hidden = !(showAccountScene || showVideoScene);
      document.querySelector("#triggerSceneLabel").textContent = showAccountScene ? labels[lang].accountSceneLabel : labels[lang].videoSceneLabel;

      const triggerSceneSelect = document.querySelector("#triggerSceneSelect");
      const sceneOptions = showAccountScene ? accountGuideScenes : videoScenes;
      const selectedScene = showAccountScene ? state.accountScene : state.triggerScene;
      triggerSceneSelect.innerHTML = Object.entries(sceneOptions)
        .map(([id, scene]) => `<option value="${id}" ${id === selectedScene ? "selected" : ""}>${scene.label[lang]}</option>`)
        .join("");

      document.querySelectorAll("#demoSwitch [data-demo]").forEach((button) => {
        const isDone = button.dataset.demo === "true";
        button.textContent = isDone ? labels[lang].yes : labels[lang].no;
        button.classList.toggle("active", isDone === state.demoDone);
      });

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === state.lang);
      });

      document.querySelector("#nodeButtons").innerHTML = currentFlow().nodes.map((id) => `
        <button type="button" data-node="${id}" class="${id === state.node ? "active" : ""}">${names[id][lang]}</button>
      `).join("");
    }

    document.querySelector("#flowSwitch").addEventListener("click", (event) => {
      const button = event.target.closest("[data-flow]");
      if (!button) return;
      state.flowType = button.dataset.flow;
      normalizeNode();
      render();
    });

    document.querySelector("#triggerSceneSelect").addEventListener("change", (event) => {
      if (state.flowType === "account" && state.node === "account_init") {
        setAccountGuideScene(event.target.value);
      } else {
        setVideoScene(event.target.value);
        if (state.flowType === "video" && state.node.startsWith("video_completed")) {
          state.node = "video_completed";
        }
      }
      render();
    });

    document.querySelector("#demoSwitch").addEventListener("click", (event) => {
      const button = event.target.closest("[data-demo]");
      if (!button) return;
      state.demoDone = button.dataset.demo === "true";
      render();
    });

    document.querySelector("#langSwitch").addEventListener("click", (event) => {
      const button = event.target.closest("[data-lang]");
      if (!button) return;
      state.lang = button.dataset.lang;
      render();
    });

    document.querySelector("#nodeButtons").addEventListener("click", (event) => {
      const button = event.target.closest("[data-node]");
      if (!button) return;
      const previousNode = state.node;
      state.node = button.dataset.node;
      const data = nodeData();
      if (state.flowType === "video" && data.triggerScene) {
        setVideoScene(data.triggerScene);
      }
      if (state.flowType === "video" && state.node === "video_help") {
        state.returnNode = previousNode && previousNode !== "video_help" ? previousNode : "video_init";
      }
      render();
    });

    document.querySelector("#tipsCard").addEventListener("click", (event) => {
      if (!event.target.closest("[data-help-video]")) return;
      state.flowType = "video";
      state.returnNode = state.node;
      state.node = "video_help";
      render();
    });

    document.querySelector("#pageBack").addEventListener("click", () => {
      if (state.flowType === "account") {
        state.node = "account_init";
      } else if (state.flowType === "video") {
        state.node = "video_init";
      }
      render();
    });

    document.querySelector("#primaryAction").addEventListener("click", () => {
      if (state.flowType === "account" && state.node === "account_init") {
        state.node = "account_reviewing";
      } else if (state.flowType === "account" && state.node === "account_interrupted") {
        state.node = "account_reviewing";
      } else if (state.flowType === "account" && state.node === "account_agreement_exit") {
        state.node = "account_interrupted";
      } else if (state.flowType === "account" && state.node === "account_reviewing" && state.demoDone) {
        state.node = "account_init";
      } else if (state.flowType === "account" && (state.node === "account_reviewing" || state.node === "account_approved") && !state.demoDone) {
        state.demoDone = true;
      } else if (state.flowType === "account" && state.node.startsWith("account_failed")) {
        state.node = "account_interrupted";
      } else if (state.flowType === "video" && state.node.startsWith("video_failed")) {
        state.node = "video_reviewing";
      } else if (state.flowType === "video" && state.node === "video_help") {
        state.node = "video_reviewing";
      } else if (state.flowType === "video" && state.node === "video_init") {
        state.node = "video_reviewing";
      } else if (state.flowType === "video" && state.node === "video_required") {
        state.node = "video_reviewing";
      } else if (state.flowType === "video" && state.node === "video_reviewing") {
        state.node = "video_completed";
      }
      render();
    });

    document.querySelector("#secondaryAction").addEventListener("click", () => {
      if (state.flowType === "account") {
        state.node = "account_init";
      } else if (state.node === "video_help") {
        state.node = currentFlow().nodes.includes(state.returnNode) ? state.returnNode : "video_init";
      } else {
        state.node = "video_init";
      }
      render();
    });

    render();
  </script>
</body>
</html>
