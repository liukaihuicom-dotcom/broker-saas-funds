<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Account Bottom Sheet</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f2f1eb;
      --phone: #fbfaf4;
      --mask: rgba(0, 0, 0, .48);
      --sheet: #fffffb;
      --surface: #fbfaf4;
      --surface-raised: #f7f6f0;
      --ink: #090909;
      --sub: #57554f;
      --muted: #817f77;
      --soft: #efeee8;
      --line: rgba(9, 9, 9, .15);
      --line-strong: rgba(9, 9, 9, .34);
      --action: #090909;
      --action-ink: #fffffb;
      --accent: #181818;
      --success: #090909;
      --warning: #806800;
      --danger: #a33127;
      --info: #4f4d47;
      --info-bg: rgba(9, 9, 9, .045);
      --warning-bg: rgba(128, 104, 0, .09);
      --error-bg: rgba(163, 49, 39, .09);
      --grid-page: rgba(0, 0, 0, .045);
      --grid-phone: rgba(0, 0, 0, .045);
      --phone-border: rgba(9, 9, 9, .2);
      --phone-shadow: rgba(20, 20, 18, .22);
      --sheet-border: rgba(9, 9, 9, .22);
      --app-hint: rgba(9, 9, 9, .5);
      --visual-fill: rgba(9, 9, 9, .08);
      --indicator: rgba(9, 9, 9, .62);
      --chrome-bg: rgba(255, 255, 251, .86);
      --panel-bg: rgba(255, 255, 251, .9);
      --panel-shadow: rgba(20, 20, 18, .18);
      --radius-sheet: 18px;
      --radius-control: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #020202;
      --phone: #080808;
      --mask: rgba(0, 0, 0, .68);
      --sheet: #0b0b0b;
      --surface: #111;
      --surface-raised: #070707;
      --ink: #f4f3ee;
      --sub: #b7b5aa;
      --muted: #7d7b72;
      --soft: #171717;
      --line: rgba(244, 243, 238, .15);
      --line-strong: rgba(244, 243, 238, .38);
      --action: #f4f3ee;
      --action-ink: #050505;
      --accent: #d8d6cb;
      --success: #f4f3ee;
      --warning: #d8c987;
      --danger: #ff6b5f;
      --info: #c9c7bd;
      --info-bg: rgba(244, 243, 238, .055);
      --warning-bg: rgba(216, 201, 135, .09);
      --error-bg: rgba(255, 107, 95, .09);
      --grid-page: rgba(255, 255, 255, .035);
      --grid-phone: rgba(255, 255, 255, .04);
      --phone-border: rgba(244, 243, 238, .2);
      --phone-shadow: rgba(0, 0, 0, .62);
      --sheet-border: rgba(244, 243, 238, .26);
      --app-hint: rgba(244, 243, 238, .52);
      --visual-fill: rgba(244, 243, 238, .12);
      --indicator: rgba(244, 243, 238, .62);
      --chrome-bg: rgba(7, 7, 7, .86);
      --panel-bg: rgba(10, 10, 10, .86);
      --panel-shadow: rgba(0, 0, 0, .56);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(var(--grid-page) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-page) 1px, transparent 1px),
        var(--page);
      background-size: 48px 48px;
      color: var(--ink);
      letter-spacing: 0;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 24px;
    }

    .phone {
      position: relative;
      width: min(390px, calc(100vw - 24px));
      height: min(844px, calc(100vh - 56px));
      min-height: 700px;
      overflow: hidden;
      border: 1px solid var(--phone-border);
      border-radius: 22px;
      background: var(--surface-raised);
      box-shadow: 0 32px 90px var(--phone-shadow);
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(var(--grid-phone) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-phone) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: .55;
      pointer-events: none;
    }

    .app-hint {
      position: absolute;
      z-index: 3;
      inset: 48px 22px auto;
      color: var(--app-hint);
      font-size: 13px;
      font-weight: 650;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .mask {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: var(--mask);
    }

    .mask[hidden] {
      display: none;
    }

    .sheet {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
      border-top: 1px solid var(--sheet-border);
      background: var(--sheet);
      animation: rise .32s cubic-bezier(.2, .8, .2, 1);
      display: flex;
      flex-direction: column;
    }

    .sheet.detail {
      max-height: 92%;
    }

    .page-view {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(var(--grid-phone) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-phone) 1px, transparent 1px),
        var(--surface-raised);
      background-size: 28px 28px;
    }

    .page-view[hidden] {
      display: none;
    }

    .page-nav {
      flex: 0 0 auto;
      min-height: 84px;
      padding: 44px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: var(--chrome-bg);
      backdrop-filter: blur(18px);
    }

    .page-nav strong {
      color: var(--ink);
      font-size: 14px;
      font-weight: 720;
    }

    .page-nav button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font-size: 18px;
      line-height: 1;
    }

    .page-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 36px 16px 18px;
      display: grid;
      align-content: start;
      justify-items: center;
      gap: 18px;
    }

    .page-content .copy {
      gap: 10px;
    }

    .page-actions {
      width: 100%;
      flex: 0 0 auto;
      padding: 16px 16px 0;
      display: grid;
      gap: 10px;
      border-top: 1px solid var(--line);
      background: var(--chrome-bg);
    }

    @keyframes rise {
      from {
        transform: translateY(26px);
        opacity: .85;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .sheet-top {
      height: 24px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
    }

    .sheet-top.detail {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 6px;
      border-bottom: 1px solid var(--line);
      background: var(--chrome-bg);
      backdrop-filter: blur(18px);
    }

    .sheet-back {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font-size: 18px;
      line-height: 1;
    }

    .sheet-back[hidden] {
      display: none;
    }

    .sheet-nav-title {
      flex: 1 1 auto;
      margin-left: 10px;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.2;
      font-weight: 720;
      text-align: right;
    }

    .sheet-nav-title[hidden] {
      display: none;
    }

    .handle[hidden] {
      display: none;
    }

    .handle {
      width: 36px;
      height: 3px;
      border-radius: 0;
      background: var(--line-strong);
    }

    .sheet-content {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 22px 16px 18px;
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .sheet-content.detail {
      padding-top: 18px;
      animation: pushDetail .2s cubic-bezier(.2, .8, .2, 1);
    }

    .sheet.detail .copy h1 {
      display: none;
    }

    @keyframes pushDetail {
      from {
        transform: translateX(18px);
        opacity: .72;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .visual {
      width: 160px;
      height: 80px;
      display: grid;
      place-items: center;
    }

    .visual svg {
      width: 72px;
      height: 72px;
      color: var(--ink);
      overflow: visible;
    }

    .visual [data-accent] {
      fill: var(--visual-fill);
    }

    .visual [data-stroke] {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .copy {
      width: 100%;
      display: grid;
      gap: 8px;
      text-align: center;
    }

    .copy h1 {
      margin: 0;
      color: var(--ink);
      font-size: 24px;
      line-height: 1.12;
      font-weight: 680;
    }

    .copy p {
      margin: 0 auto;
      max-width: 330px;
      color: var(--sub);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 400;
    }

    .reason-note {
      width: min(330px, 100%);
      margin: 4px auto 0;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--info-bg);
      color: var(--info);
      font-size: 13px;
      line-height: 1.42;
      font-weight: 520;
      text-align: left;
    }

    .reason-note[data-level="warning"] {
      border-color: color-mix(in oklch, var(--warning) 24%, var(--line));
      background: var(--warning-bg);
      color: var(--warning);
    }

    .reason-note[data-level="error"] {
      border-color: color-mix(in oklch, var(--danger) 24%, var(--line));
      background: var(--error-bg);
      color: var(--danger);
    }

    .reason-note[hidden] {
      display: none;
    }

    .tips-card {
      width: min(330px, 100%);
      margin: 6px auto 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      background: var(--surface);
      display: grid;
      gap: 9px;
      text-align: left;
    }

    .tips-card[hidden] {
      display: none;
    }

    .tips-card ul {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tips-card li {
      position: relative;
      padding-left: 18px;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.38;
      font-weight: 540;
    }

    .tips-card li::before {
      content: "";
      position: absolute;
      left: 0;
      top: .56em;
      width: 6px;
      height: 6px;
      border-radius: 0;
      background: var(--accent);
    }

    .tips-card button {
      width: max-content;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      font-weight: 680;
      text-align: left;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .info-card {
      width: min(330px, 100%);
      margin: 6px auto 0;
      display: grid;
      gap: 8px;
      text-align: left;
    }

    .info-card[hidden] {
      display: none;
    }

    .info-item {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      background: var(--surface);
      display: grid;
      gap: 4px;
    }

    .info-item strong {
      color: var(--ink);
      font-size: 13px;
      line-height: 1.3;
      font-weight: 720;
    }

    .info-item span {
      color: var(--sub);
      font-size: 12px;
      line-height: 1.42;
      font-weight: 520;
    }

    .info-item ul {
      display: grid;
      gap: 4px;
      margin: 2px 0 0;
      padding: 0;
      list-style: none;
    }

    .info-item li {
      color: var(--sub);
      font-size: 12px;
      line-height: 1.38;
      font-weight: 540;
    }

    .account-card {
      width: min(330px, 100%);
      margin: 6px auto 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      background: var(--surface);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 12px;
      text-align: left;
    }

    .account-card[hidden] {
      display: none;
    }

    .account-card span {
      color: var(--sub);
      font-size: 12px;
      line-height: 1.25;
      font-weight: 560;
    }

    .account-card strong {
      color: var(--ink);
      font-size: 16px;
      line-height: 1.2;
      font-weight: 760;
    }

    .account-card em {
      align-self: start;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      background: transparent;
      color: var(--success);
      font-size: 11px;
      line-height: 1;
      font-style: normal;
      font-weight: 720;
      white-space: nowrap;
    }

    .account-card small {
      grid-column: 1 / -1;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 520;
    }

    .sheet-actions {
      width: 100%;
      flex: 0 0 auto;
      padding: 16px 16px 0;
      display: grid;
      gap: 10px;
    }

    .primary,
    .secondary {
      width: 100%;
      min-height: 48px;
      border-radius: 6px;
      line-height: 1;
      font-weight: 610;
    }

    .primary {
      border: 1px solid var(--action);
      background: var(--action);
      color: var(--action-ink);
      font-size: 16px;
      transition: transform .18s cubic-bezier(.2, .8, .2, 1), background .18s cubic-bezier(.2, .8, .2, 1), color .18s cubic-bezier(.2, .8, .2, 1);
    }

    .secondary {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font-size: 15px;
    }

    .primary:hover {
      background: transparent;
      color: var(--ink);
      transform: translateY(-1px);
    }

    .primary:active {
      transform: translateY(0);
    }

    .primary:focus-visible,
    .secondary:focus-visible,
    .switch button:focus-visible,
    .node-grid button:focus-visible,
    .tips-card button:focus-visible,
    .field select:focus-visible,
    .page-nav button:focus-visible,
    .sheet-back:focus-visible {
      outline: 3px solid color-mix(in oklch, var(--action) 45%, transparent);
      outline-offset: 2px;
    }

    .secondary[hidden] {
      display: none;
    }

    .page-actions .secondary[hidden] {
      display: none;
    }

    .primary span {
      display: inline-block;
      margin-left: 8px;
      transform: translateY(-1px);
    }

    .home-indicator {
      height: 34px;
      flex: 0 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
    }

    .home-indicator::before {
      content: "";
      width: 134px;
      height: 4px;
      border-radius: 100px;
      background: var(--indicator);
    }

    .control-panel {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 10;
      width: min(348px, calc(100vw - 44px));
      max-height: calc(100vh - 44px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      padding: 14px;
      background: var(--panel-bg);
      box-shadow: 0 24px 70px var(--panel-shadow);
      backdrop-filter: blur(18px);
    }

    .control-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .control-head strong {
      font-size: 14px;
      font-weight: 720;
    }

    .control-head span {
      color: var(--sub);
      font-size: 11px;
      font-weight: 650;
      text-align: right;
    }

    .control-stack {
      display: grid;
      gap: 12px;
    }

    .control-row {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, .9fr);
      gap: 8px;
    }

    .control-section {
      display: grid;
      gap: 7px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field[hidden],
    .control-section[hidden] {
      display: none;
    }

    .section-label,
    .field label {
      color: var(--sub);
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
    }

    .field select {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0 9px;
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
      font-weight: 620;
    }

    .switch {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px;
      background: var(--surface);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
    }

    .switch button {
      min-height: 32px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: var(--sub);
      font-size: 12px;
      font-weight: 700;
    }

    .switch button.active {
      background: var(--action);
      color: var(--action-ink);
    }

    .node-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .node-grid button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }

    .node-grid button.active {
      border-color: var(--action);
      background: var(--action);
      color: var(--action-ink);
    }

    @media (max-width: 900px) {
      .stage {
        padding: 12px 10px;
      }

      .phone {
        height: min(844px, calc(100vh - 24px));
        min-height: 0;
        border-radius: 24px;
      }
    }

    @media (max-width: 420px) {
      .stage {
        padding: 0;
      }

      .phone {
        width: 100vw;
        height: 100vh;
        min-height: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .copy h1 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="App account opening guide preview">
      <div class="app-hint">
        <span>9:41</span>
        <span>5G 100%</span>
      </div>
      <section class="page-view" id="pageView" aria-label="Account feedback page" aria-live="polite" hidden>
        <div class="page-nav">
          <button type="button" id="pageClose" aria-label="Close">×</button>
          <strong id="pageNavTitle"></strong>
        </div>
        <div class="page-content">
          <div class="visual" id="pageVisual" aria-hidden="true"></div>
          <div class="copy">
            <h1 id="pageTitle"></h1>
            <p id="pageDesc"></p>
            <div class="reason-note" id="pageFailureReason" hidden></div>
            <div class="tips-card" id="pageTipsCard" hidden></div>
            <div class="info-card" id="pageInfoCard" hidden></div>
            <div class="account-card" id="pageAccountCard" hidden></div>
          </div>
        </div>
        <div class="page-actions">
          <button class="primary" type="button" id="pagePrimaryAction"></button>
          <button class="secondary" type="button" id="pageSecondaryAction" hidden></button>
        </div>
        <div class="home-indicator"></div>
      </section>
      <div class="mask">
        <section class="sheet" id="sheet" aria-label="Open account bottom sheet" aria-live="polite">
          <div class="sheet-top" id="sheetTop">
            <button class="sheet-back" type="button" id="sheetBack" aria-label="返回" hidden>←</button>
            <strong class="sheet-nav-title" id="sheetNavTitle" hidden></strong>
            <div class="handle" id="sheetHandle"></div>
          </div>
          <div class="sheet-content" id="sheetContent">
            <div class="visual" id="visual" aria-hidden="true"></div>
            <div class="copy">
              <h1 id="sheetTitle"></h1>
              <p id="sheetDesc"></p>
              <div class="reason-note" id="failureReason" hidden></div>
              <div class="tips-card" id="tipsCard" hidden></div>
              <div class="info-card" id="infoCard" hidden></div>
              <div class="account-card" id="accountCard" hidden></div>
            </div>
          </div>
          <div class="sheet-actions">
            <button class="primary" type="button" id="primaryAction"></button>
            <button class="secondary" type="button" id="secondaryAction" hidden></button>
          </div>
          <div class="home-indicator"></div>
        </section>
      </div>
    </section>

    <aside class="control-panel" aria-label="Prototype controls">
      <div class="control-head">
        <strong id="panelTitle"></strong>
        <span id="panelSummary"></span>
      </div>
      <div class="control-stack">
        <div class="control-row">
          <div class="field">
            <label id="flowLabel"></label>
            <div class="switch" id="flowSwitch"></div>
          </div>
          <div class="field">
            <label id="langLabel"></label>
            <div class="switch" id="langSwitch">
              <button type="button" data-lang="zh">中文</button>
              <button type="button" data-lang="en">EN</button>
            </div>
          </div>
        </div>
        <div class="control-row">
          <div class="field" id="themeField">
            <label id="themeLabel"></label>
            <div class="switch" id="themeSwitch">
              <button type="button" data-theme-option="light">Light</button>
              <button type="button" data-theme-option="dark">Dark</button>
            </div>
          </div>
          <div class="field" id="demoField">
            <label id="demoLabel"></label>

        video: '<rect x="24" y="64" width="176" height="128" rx="8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><polyline points="200 112 248 80 248 176 200 144" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>',
        demo: '<polyline points="224 208 32 208 32 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><polyline points="200 72 128 144 96 112 32 176" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><polyline points="200 112 200 72 160 72" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>',
        pause: '<circle cx="128" cy="128" r="96" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="16"/><line x1="104" y1="96" x2="104" y2="160" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="152" y1="96" x2="152" y2="160" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>',
        review: '<path d="M128,128,67.2,82.4A8,8,0,0,1,64,76V40a8,8,0,0,1,8-8H184a8,8,0,0,1,8,8V75.64A8,8,0,0,1,188.82,82L128,128h0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><path d="M128,128,67.2,173.6A8,8,0,0,0,64,180v36a8,8,0,0,0,8,8H184a8,8,0,0,0,8-8V180.36a8,8,0,0,0-3.18-6.38L128,128h0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="128" y1="168" x2="128" y2="128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="74.67" y1="88" x2="180.92" y2="88" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>',
        success: '<polyline points="88 136 112 160 168 104" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><circle cx="128" cy="128" r="96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>',
        failed: '<line x1="160" y1="96" x2="96" y2="160" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="96" y1="96" x2="160" y2="160" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><circle cx="128" cy="128" r="96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>'
      };
      const paths = icons[type] || icons.open;

      return `
        <svg viewBox="0 0 256 256" focusable="false" aria-hidden="true">
          <rect width="256" height="256" fill="none"/>
          ${paths}
        </svg>
      `;
    }

    function renderFeedbackContent(ids, data, lang) {
      document.querySelector(ids.visual).innerHTML = iconSvg(data.icon);
      document.querySelector(ids.title).textContent = data.title[lang];
      document.querySelector(ids.desc).textContent = data.desc[lang];

      const failureReason = document.querySelector(ids.failureReason);
      failureReason.textContent = data.error ? data.error[lang] : "";
      failureReason.dataset.level = data.noticeLevel || "info";
      if (data.error) {
        failureReason.setAttribute("role", data.noticeLevel === "error" ? "alert" : "status");
      } else {
        failureReason.removeAttribute("role");
      }
      failureReason.hidden = !data.error;

      const tipsCard = document.querySelector(ids.tipsCard);
      if (data.tips || data.help) {
        const tips = data.tips ? `<ul>${data.tips.map((tip) => `<li>${tip[lang]}</li>`).join("")}</ul>` : "";
        const help = data.help ? `<button type="button" data-help-video>${data.help[lang]}</button>` : "";
        tipsCard.innerHTML = `${tips}${help}`;
        tipsCard.hidden = false;
      } else {
        tipsCard.innerHTML = "";
        tipsCard.hidden = true;
      }

      const infoCard = document.querySelector(ids.infoCard);
      if (data.info) {
        infoCard.innerHTML = data.info.map((item) => `
          <div class="info-item">
            <strong>${item.title[lang]}</strong>
            ${item.body ? `<span>${item.body[lang]}</span>` : ""}
            ${item.items ? `<ul>${item.items.map((entry) => `<li>✓ ${entry[lang]}</li>`).join("")}</ul>` : ""}
          </div>
        `).join("");
        infoCard.hidden = false;
      } else {
        infoCard.innerHTML = "";
        infoCard.hidden = true;
      }

      const accountCard = document.querySelector(ids.accountCard);
      if (data.account) {
        accountCard.innerHTML = `
          <div>
            <span>${data.account.label[lang]}</span>
            <strong>${data.account.number}</strong>
          </div>
          <em>${data.account.status[lang]}</em>
          <small>${data.account.meta[lang]}</small>
        `;
        accountCard.hidden = false;
      } else {
        accountCard.innerHTML = "";
        accountCard.hidden = true;
      }

      document.querySelector(ids.primaryAction).innerHTML = `${data.primary[lang]}<span>→</span>`;
      const secondaryAction = document.querySelector(ids.secondaryAction);
      secondaryAction.textContent = data.secondary ? data.secondary[lang] : "";
      secondaryAction.hidden = !data.secondary;
    }

    function isPageMode() {
      return state.flowType === "account" && accountFeedbackPageNodes.has(state.node);
    }

    function openModal() {
      state.overlayOpen = true;
    }

    function closeModal() {
      state.overlayOpen = false;
      render();
    }

    function render() {
      normalizeNode();
      const data = nodeData();
      const lang = state.lang;
      const names = nodeNameMap();

      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.documentElement.dataset.theme = state.theme;
      renderFeedbackContent({
        visual: "#visual",
        title: "#sheetTitle",
        desc: "#sheetDesc",
        failureReason: "#failureReason",
        tipsCard: "#tipsCard",
        infoCard: "#infoCard",
        accountCard: "#accountCard",
        primaryAction: "#primaryAction",
        secondaryAction: "#secondaryAction"
      }, data, lang);
      renderFeedbackContent({
        visual: "#pageVisual",
        title: "#pageTitle",
        desc: "#pageDesc",
        failureReason: "#pageFailureReason",
        tipsCard: "#pageTipsCard",
        infoCard: "#pageInfoCard",
        accountCard: "#pageAccountCard",
        primaryAction: "#pagePrimaryAction",
        secondaryAction: "#pageSecondaryAction"
      }, data, lang);
      document.querySelector("#pageNavTitle").textContent = labels[lang].pageTitle;

      const pageMode = isPageMode();
      const sheetDetailMode = state.flowType === "video" && state.node === "video_help";
      document.querySelector("#pageView").hidden = !pageMode;
      document.querySelector(".mask").hidden = pageMode || !state.overlayOpen;
      document.querySelector("#sheet").classList.toggle("detail", sheetDetailMode);
      document.querySelector("#sheetTop").classList.toggle("detail", sheetDetailMode);
      document.querySelector("#sheetContent").classList.toggle("detail", sheetDetailMode);
      document.querySelector("#sheetBack").hidden = !sheetDetailMode;
      document.querySelector("#sheetBack").setAttribute("aria-label", lang === "zh" ? "返回" : "Back");
      document.querySelector("#sheetNavTitle").hidden = !sheetDetailMode;
      document.querySelector("#sheetNavTitle").textContent = sheetDetailMode ? data.title[lang] : "";
      document.querySelector("#sheetHandle").hidden = sheetDetailMode;

      document.querySelector("#panelTitle").textContent = labels[lang].panelTitle;
      document.querySelector("#flowLabel").textContent = labels[lang].flowLabel;
      document.querySelector("#nodeLabel").textContent = labels[lang].nodeLabel;
      document.querySelector("#triggerSceneLabel").textContent = labels[lang].triggerSceneLabel;
      document.querySelector("#demoLabel").textContent = labels[lang].demoLabel;
      document.querySelector("#langLabel").textContent = labels[lang].langLabel;
      document.querySelector("#themeLabel").textContent = labels[lang].themeLabel;
      document.querySelector("#panelSummary").textContent = `${currentFlow().label[lang]} / ${names[state.node][lang]}`;

      document.querySelector("#flowSwitch").innerHTML = Object.entries(flows)
        .map(([id, flow]) => `<button type="button" data-flow="${id}" class="${id === state.flowType ? "active" : ""}">${flow.label[lang]}</button>`)
        .join("");

      document.querySelector("#demoField").hidden = state.flowType !== "account";
      document.querySelector("#triggerSceneField").hidden = !(state.flowType === "video" && sceneAwareVideoNodes.has(state.node));

      const triggerSceneSelect = document.querySelector("#triggerSceneSelect");
      triggerSceneSelect.innerHTML = Object.entries(videoScenes)
        .map(([id, scene]) => `<option value="${id}" ${id === state.triggerScene ? "selected" : ""}>${scene.label[lang]}</option>`)
        .join("");

      document.querySelectorAll("[data-demo]").forEach((button) => {
        const isDone = button.dataset.demo === "true";
        button.textContent = isDone ? labels[lang].yes : labels[lang].no;
        button.classList.toggle("active", isDone === state.demoDone);
      });

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === state.lang);
      });

      document.querySelectorAll("[data-theme-option]").forEach((button) => {
        button.classList.toggle("active", button.dataset.themeOption === state.theme);
      });

      document.querySelector("#nodeButtons").innerHTML = currentFlow().nodes.map((id) => `
        <button type="button" data-node="${id}" class="${id === state.node ? "active" : ""}">${names[id][lang]}</button>
      `).join("");
    }

    document.querySelector("#flowSwitch").addEventListener("click", (event) => {
      const button = event.target.closest("[data-flow]");
      if (!button) return;
      state.flowType = button.dataset.flow;
      openModal();
      normalizeNode();
      render();
    });

    document.querySelector("#triggerSceneSelect").addEventListener("change", (event) => {
      setVideoScene(event.target.value);
      if (state.flowType === "video" && state.node.startsWith("video_completed")) {
        state.node = "video_completed";
      }
      render();
    });

    document.querySelector("#demoSwitch").addEventListener("click", (event) => {
      const button = event.target.closest("[data-demo]");
      if (!button) return;
      state.demoDone = button.dataset.demo === "true";
      render();
    });

    document.querySelector("#langSwitch").addEventListener("click", (event) => {
      const button = event.target.closest("[data-lang]");
      if (!button) return;
      state.lang = button.dataset.lang;
      render();
    });

    document.querySelector("#themeSwitch").addEventListener("click", (event) => {
      const button = event.target.closest("[data-theme-option]");
      if (!button) return;
      state.theme = button.dataset.themeOption;
      render();
    });

    document.querySelector("#nodeButtons").addEventListener("click", (event) => {
      const button = event.target.closest("[data-node]");
      if (!button) return;
      const previousNode = state.node;
      state.node = button.dataset.node;
      openModal();
      const data = nodeData();
      if (state.flowType === "video" && data.triggerScene) {
        setVideoScene(data.triggerScene);
      }
      if (state.flowType === "video" && state.node === "video_help") {
        state.returnNode = previousNode && previousNode !== "video_help" ? previousNode : "video_init";
      }
      render();
    });

    document.querySelector("#tipsCard").addEventListener("click", (event) => {
      if (!event.target.closest("[data-help-video]")) return;
      state.flowType = "video";
      state.returnNode = state.node;
      state.node = "video_help";
      openModal();
      render();
    });

    document.querySelector("#pageTipsCard").addEventListener("click", (event) => {
      if (!event.target.closest("[data-help-video]")) return;
      state.flowType = "video";
      state.returnNode = state.node;
      state.node = "video_help";
      openModal();
      render();
    });

    function handlePrimaryAction() {
      if (state.flowType === "account" && state.node === "account_init") {
        state.node = "account_reviewing";
      } else if (state.flowType === "account" && state.node === "account_interrupted") {
        state.node = "account_reviewing";
      } else if (state.flowType === "account" && state.node === "account_agreement_exit") {
        state.node = "account_interrupted";
      } else if (state.flowType === "account" && state.node === "account_reviewing" && state.demoDone) {
        render();
        return;
      } else if (state.flowType === "account" && (state.node === "account_reviewing" || state.node === "account_approved") && !state.demoDone) {
        state.demoDone = true;
      } else if (state.flowType === "account" && state.node === "account_reviewing") {
        state.node = "account_reviewing";
      } else if (state.flowType === "account" && state.node.startsWith("account_failed")) {
        state.node = "account_interrupted";
      } else if (state.flowType === "video" && state.node.startsWith("video_failed")) {
        state.node = "video_reviewing";
      } else if (state.flowType === "video" && state.node === "video_help") {
        state.node = "video_reviewing";
      } else if (state.flowType === "video" && state.node === "video_init") {
        state.node = "video_reviewing";
      } else if (state.flowType === "video" && state.node === "video_required") {
        state.node = "video_reviewing";
      } else if (state.flowType === "video" && state.node === "video_reviewing") {
        state.node = "video_completed";
      }
      openModal();
      render();
    }

    function handleSecondaryAction() {
      if (state.flowType === "account") {
        state.node = "account_init";
      } else if (state.node === "video_help") {
        state.node = currentFlow().nodes.includes(state.returnNode) ? state.returnNode : "video_init";
      } else {
        state.node = "video_init";
      }
      openModal();
      render();
    }

    document.querySelector("#sheetBack").addEventListener("click", () => {
      if (state.flowType !== "video" || state.node !== "video_help") return;
      state.node = currentFlow().nodes.includes(state.returnNode) ? state.returnNode : "video_init";
      openModal();
      render();
    });

    document.querySelector(".mask").addEventListener("click", (event) => {
      if (event.target !== event.currentTarget) return;
      closeModal();
    });

    document.querySelector("#pageClose").addEventListener("click", () => {
      state.node = "account_init";
      openModal();
      render();
    });

    document.querySelector("#primaryAction").addEventListener("click", handlePrimaryAction);
    document.querySelector("#pagePrimaryAction").addEventListener("click", handlePrimaryAction);
    document.querySelector("#secondaryAction").addEventListener("click", handleSecondaryAction);
    document.querySelector("#pageSecondaryAction").addEventListener("click", handleSecondaryAction);

    render();
  </script>
</body>
</html>
