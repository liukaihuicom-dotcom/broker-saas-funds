<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funds App</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f3f3;
      --app: #f7f7f7;
      --surface: #ffffff;
      --surface-2: #eeeeee;
      --glass: rgba(247, 247, 247, .96);
      --panel: rgba(255, 255, 255, .96);
      --body-bg: #f3f3f3;
      --ink: #000000;
      --muted: #5f6368;
      --line: #dedede;
      --soft-line: #eeeeee;
      --active-bg: #000000;
      --active-border: #000000;
      --brand: #000000;
      --brand-dark: #000000;
      --blue: #276ef1;
      --red: #e11900;
      --amber: #b95000;
      --green: #048848;
      --danger: #e11900;
      --shadow: 0 18px 44px rgba(0, 0, 0, .12);
      --radius: 4px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --page: #000000;
      --app: #0f0f0f;
      --surface: #1a1a1a;
      --surface-2: #2a2a2a;
      --glass: rgba(15, 15, 15, .96);
      --panel: rgba(26, 26, 26, .96);
      --body-bg: #000000;
      --ink: #ffffff;
      --muted: #a6a6a6;
      --line: #333333;
      --soft-line: #262626;
      --active-bg: #ffffff;
      --active-border: #ffffff;
      --brand: #ffffff;
      --brand-dark: #ffffff;
      --blue: #5b91f5;
      --red: #ff5c4d;
      --amber: #ffb14a;
      --green: #06c167;
      --danger: #ff5c4d;
      --shadow: 0 26px 78px rgba(0, 0, 0, .48);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--body-bg);
      color: var(--ink);
      letter-spacing: 0;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .stage {
      min-height: 100vh;
      padding: 34px 24px 110px;
      display: grid;
      justify-items: center;
      align-items: start;
    }

    .device {
      width: min(392px, calc(100vw - 34px));
      border: 10px solid #000000;
      border-radius: 28px;
      background: #000000;
      box-shadow: var(--shadow);
    }

    .app {
      height: min(812px, calc(100vh - 56px));
      min-height: 650px;
      overflow: hidden;
      border-radius: 18px;
      background: var(--app);
      display: flex;
      flex-direction: column;
    }

    .status {
      height: 30px;
      padding: 8px 18px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink);
      font-size: 11px;
      font-weight: 780;
      background: var(--glass);
    }

    .appbar {
      padding: 12px 18px 14px;
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      gap: 10px;
      align-items: center;
      background: var(--glass);
      border-bottom: 1px solid var(--line);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: 17px;
      font-weight: 780;
    }

    .title {
      min-width: 0;
      text-align: center;
    }

    .title strong {
      display: block;
      font-size: 19px;
      line-height: 1.16;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      margin-top: 5px;
      padding: 3px 8px;
      border-radius: 2px;
      background: var(--ink);
      color: var(--app);
      font-size: 11px;
      font-weight: 800;
    }

    .content {
      flex: 1;
      padding: 14px 16px 16px;
      overflow: auto;
    }

    .hero-card {
      position: relative;
      min-height: 218px;
      padding: 22px;
      overflow: hidden;
      border-radius: 4px;
      color: #fff;
      background: #000000;
      box-shadow: none;
      display: grid;
      align-content: space-between;
    }

    .hero-card.alt {
      background: #000000;
    }

    .hero-card::before,
    .hero-card::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .hero-card::before {
      width: 96px;
      height: 96px;
      right: 20px;
      top: 22px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 4px;
      transform: rotate(45deg);
    }

    .hero-card::after {
      left: 22px;
      right: 22px;
      bottom: 90px;
      height: 2px;
      background: #ffffff;
      opacity: .16;
    }

    .metric-label {
      color: rgba(255, 255, 255, .72);
      font-size: 12px;
      font-weight: 800;
    }

    .metric-value {
      margin-top: 12px;
      font-size: 43px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
    }

    .metric-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    .mini-metric {
      min-height: 62px;
      padding: 12px;
      border-radius: var(--radius);
      background: #1f1f1f;
      border: 1px solid #333333;
    }

    .mini-metric span,
    .mini-metric b {
      display: block;
    }

    .mini-metric span {
      color: rgba(255, 255, 255, .72);
      font-size: 11px;
    }

    .mini-metric b {
      margin-top: 4px;
      font-size: 14px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 12px 0;
    }

    .quick-grid.two {
      grid-template-columns: repeat(2, 1fr);
    }

    .quick-grid.four {
      grid-template-columns: repeat(2, 1fr);
    }

    .quick {
      min-height: 76px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      display: grid;
      place-items: center;
      align-content: center;
      gap: 7px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 850;
    }

    .quick span {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 2px;
      background: var(--ink);
      color: var(--app);
      font-size: 16px;
      line-height: 1;
    }

    .section-title {
      margin: 18px 1px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      font-weight: 860;
    }

    .section-title small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
    }

    .list {
      display: grid;
      gap: 9px;
    }

    .item {
      min-height: 62px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .item-main {
      min-width: 0;
    }

    .item-main strong {
      display: block;
      font-size: 13px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-main span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .amount {
      flex: 0 0 auto;
      text-align: right;
      font-size: 13px;
      font-weight: 860;
    }

    .amount small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 720;
    }

    .badge {
      flex: 0 0 auto;
      min-height: 25px;
      padding: 5px 8px;
      border-radius: 2px;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.green { background: var(--green); }
    .badge.amber { background: var(--amber); }
    .badge.red { background: var(--danger); }
    .badge.blue { background: var(--blue); }
    .badge.gray { background: #71818c; }

    .form {
      display: grid;
      gap: 10px;
    }

    .field {
      min-height: 68px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .field label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
    }

    .field-value {
      margin-top: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      font-weight: 820;
    }

    .field-value span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .select-field {
      width: 100%;
      min-height: 68px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      text-align: left;
    }

    .select-field label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      pointer-events: none;
    }

    .select-field .field-value {
      pointer-events: none;
    }

    .select-field[aria-disabled="true"] {
      cursor: default;
    }

    .account-options,
    .channel-grid {
      display: grid;
      gap: 9px;
    }

    .account-option,
    .channel-card {
      width: 100%;
      min-height: 66px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .account-option.active,
    .channel-card.active {
      border-color: var(--active-border);
      background: var(--active-bg);
      color: var(--app);
    }

    .account-option.active span,
    .channel-card.active span,
    .account-option.active small,
    .channel-card.active small {
      color: color-mix(in srgb, var(--app) 72%, transparent);
    }

    .account-option strong,
    .channel-card strong {
      display: block;
      font-size: 13px;
    }

    .account-option span,
    .channel-card span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
    }

    .channel-card.disabled {
      cursor: not-allowed;
      opacity: .46;
      filter: saturate(.6);
    }

    .keypad {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .amount-stage {
      min-height: 190px;
      padding: 20px;
      border-radius: 4px;
      color: #111820;
      background: #ffffff;
      border: 1px solid #dedede;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    .amount-stage label {
      display: block;
      color: #65737d;
      font-size: 12px;
      font-weight: 760;
    }

    .amount-display {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 16px;
    }

    .amount-display span {
      color: #65737d;
      font-size: 20px;
      font-weight: 820;
    }

    .amount-display strong {
      font-size: 46px;
      line-height: 1;
      font-weight: 860;
    }

    .amount-stage .chips {
      margin-top: 24px;
    }

    .amount-stage .chip {
      border-color: #dce4e8;
      background: #fff;
      color: #24323a;
      box-shadow: none;
    }

    .amount-stage .chip.active {
      border-color: #000000;
      background: #000000;
      color: #ffffff;
    }

    body[data-theme="dark"] .amount-stage {
      color: #111820;
      background: #ffffff;
      border-color: #ffffff;
      box-shadow: none;
    }

    .money-input {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      padding: 8px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .money-input span {
      color: var(--muted);
      font-size: 18px;
      font-weight: 800;
    }

    .money-input strong {
      font-size: 38px;
      line-height: 1;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .chip {
      min-height: 30px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .chip.active {
      border-color: var(--active-border);
      background: var(--active-bg);
      color: var(--app);
    }

    .primary {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      border: 0;
      border-radius: var(--radius);
      background: var(--brand);
      color: var(--app);
      font-size: 15px;
      font-weight: 860;
      box-shadow: none;
    }

    .primary:disabled {
      cursor: not-allowed;
      opacity: .48;
      box-shadow: none;
    }

    .flow-action {
      display: none;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: var(--glass);
      backdrop-filter: blur(16px);
    }

    .flow-action.show {
      display: block;
    }

    .flow-action .primary {
      margin-top: 0;
    }

    .secondary {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-bottom: 12px;
    }

    .toolbar .chip {
      flex: 0 0 auto;
    }

    .client-card {
      min-height: 92px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .client-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 850;
    }

    .progress {
      height: 7px;
      margin-top: 13px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .progress b {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--ink);
    }

    .review-panel {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .review-panel .row {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--soft-line);
      font-size: 13px;
      font-weight: 760;
    }

    .review-panel .row:last-child {
      border-bottom: 0;
    }

    .review-panel .row span {
      color: var(--muted);
      font-weight: 720;
    }

    .risk-score {
      min-height: 164px;
      padding: 18px;
      border-radius: var(--radius);
      background: #2f3337;
      color: #fff;
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
    }

    .risk-score strong {
      display: block;
      font-size: 58px;
      line-height: 1;
    }

    .risk-score span {
      margin-top: 8px;
      color: rgba(255, 255, 255, .72);
      font-size: 12px;
      font-weight: 740;
    }

    .tabbar {
      height: 64px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .tab {
      border: 0;
      background: transparent;
      color: #7a8790;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 780;
    }

    .tab b {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      font-size: 15px;
      line-height: 1;
    }

    .tab.active {
      color: var(--brand);
    }

    .control-panel {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 40;
      width: min(380px, calc(100vw - 44px));
      padding: 14px;
      border: 1px solid rgba(220, 228, 232, .95);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(22, 35, 45, .18);
      backdrop-filter: blur(18px);
    }

    .control-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .control-head strong {
      font-size: 14px;
    }

    .control-head span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
    }

    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .control-field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 780;
    }

    .control-field select {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      padding: 0 10px;
      font-size: 13px;
      font-weight: 760;
    }

    .control-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 12px;
    }

    .control-actions button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
      font-weight: 780;
    }

    .control-actions button.active {
      border-color: var(--active-border);
      background: var(--active-bg);
      color: var(--app);
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(10, 20, 25, .34);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 80;
      width: min(430px, 100vw);
      max-height: min(78vh, 640px);
      padding: 10px 14px 18px;
      border-radius: 22px 22px 0 0;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 -24px 64px rgba(20, 34, 42, .22);
      transform: translate(-50%, 105%);
      transition: transform .24s ease;
      backdrop-filter: blur(18px);
    }

    .drawer.open {
      transform: translate(-50%, 0);
    }

    .drawer-handle {
      width: 42px;
      height: 5px;
      margin: 0 auto 13px;
      border-radius: 99px;
      background: var(--line);
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .drawer-head strong {
      font-size: 17px;
    }

    .drawer-close {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font-weight: 820;
    }

    .drawer-list {
      display: grid;
      gap: 9px;
      overflow: auto;
      max-height: calc(min(78vh, 640px) - 84px);
      padding-bottom: 4px;
    }

    @media (max-width: 760px) {
      .stage {
        padding: 12px 10px 266px;
        align-items: start;
      }

      .device {
        border-width: 0;
        border-radius: 0;
        width: 100%;
        max-width: 430px;
        box-shadow: none;
        background: transparent;
      }

      .app {
        height: calc(100vh - 278px);
        min-height: 560px;
        border-radius: 0 0 18px 18px;
      }

      .control-panel {
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="device" aria-label="Funds app prototype">
      <div class="app">
        <div class="status">
          <span>9:41</span>
          <span>5G 100%</span>
        </div>
        <header class="appbar">
          <button class="icon-btn" type="button" aria-label="返回">‹</button>
          <div class="title">
            <strong id="screenTitle">资金总览</strong>
            <span id="roleChip">Trader</span>
          </div>
          <button class="icon-btn" type="button" aria-label="消息">•</button>
        </header>
        <div class="content" id="screen"></div>

    function clientCard(initials, name, assets, progress, status) {
      const statusText = String(status).toLowerCase();
      const statusTone = status.includes("待") || status.includes("缺") || status.includes("失败") || statusText.includes("pending") || statusText.includes("missing") || statusText.includes("failed") || statusText.includes("review") ? "amber" : "green";
      return `
        <div class="client-card">
          <div class="client-head">
            <div class="avatar-row">
              <div class="avatar">${initials}</div>
              <div class="item-main">
                <strong>${name}</strong>
                <span>${assets}</span>
              </div>
            </div>
            ${badge(status, statusTone)}
          </div>
          <div class="progress"><b style="width:${progress}"></b></div>
        </div>
      `;
    }

    function currentScenes() {
      return roles[appState.role].scenes;
    }

    function sceneName(sceneId) {
      const found = currentScenes().find(([id]) => id === sceneId);
      return found ? (appState.lang === "zh" ? found[1] : found[2]) : "";
    }

    function ensureScene() {
      const ids = currentScenes().map(([id]) => id);
      if (!ids.includes(appState.scene)) {
        appState.scene = ids[0];
      }
    }

    function roleKind() {
      return appState.role === "ib" ? "partner" : "trader";
    }

    function closeDrawer() {
      appState.activeDrawer = null;
      renderDrawer();
    }

    function renderControls() {
      document.documentElement.lang = appState.lang === "zh" ? "zh-CN" : "en";
      document.body.dataset.theme = appState.theme;
      controlTitle.textContent = t("控制面板", "Control Panel");
      roleLabel.textContent = t("角色", "Role");
      sceneLabel.textContent = t("场景", "Scene");
      languageLabel.textContent = t("语言", "Language");
      themeLabel.textContent = t("主题", "Theme");
      accountModeLabel.textContent = t("账号情况", "Account Mode");

      roleSelect.innerHTML = Object.entries(roles)
        .map(([id, role]) => `<option value="${id}" ${id === appState.role ? "selected" : ""}>${roleName(role)}</option>`)
        .join("");

      sceneSelect.innerHTML = currentScenes()
        .map(([id, zh, en]) => `<option value="${id}" ${id === appState.scene ? "selected" : ""}>${t(zh, en)}</option>`)
        .join("");

      languageSelect.value = appState.lang;
      themeSelect.value = appState.theme;
      accountModeSelect.value = appState.accountMode;

      accountModeSelect.options[0].textContent = t("多个交易账号", "Multiple Accounts");
      accountModeSelect.options[1].textContent = t("单个交易账号", "Single Account");

      roleButtons.innerHTML = Object.entries(roles)
        .map(([id, role]) => `<button type="button" data-role="${id}" class="${id === appState.role ? "active" : ""}">${roleName(role)}</button>`)
        .join("");

      panelState.textContent = `${roleName(roles[appState.role])} / ${sceneName(appState.scene)}`;
    }

    function renderTabbar() {
      tabbar.innerHTML = roles[appState.role].tabs
        .map(([scene, icon, zh, en]) => `
          <button class="tab ${scene === appState.scene ? "active" : ""}" type="button" data-tab="${scene}">
            <b>${icon}</b>
            ${t(zh, en)}
          </button>
        `)
        .join("");
    }

    function renderDrawer() {
      const drawer = appState.activeDrawer;
      drawerBackdrop.classList.toggle("open", Boolean(drawer));
      bottomDrawer.classList.toggle("open", Boolean(drawer));

      if (!drawer) {
        drawerTitle.textContent = t("选择", "Select");
        drawerList.innerHTML = "";
        return;
      }

      const kind = roleKind();

      if (drawer === "depositAccount" || drawer === "withdrawAccount") {
        const isDeposit = drawer === "depositAccount";
        const accounts = depositAccounts(kind);
        const selected = isDeposit ? resolveDepositAccount(kind) : resolveWithdrawAccount(kind);
        drawerTitle.textContent = t("交易账号", "Trading Account");
        drawerList.innerHTML = accounts.map(([id, type, equity]) => `
          <button class="account-option ${selected === id ? "active" : ""}" type="button" data-select-${isDeposit ? "deposit" : "withdraw"}-account="${id}">
            <div><strong>${id}</strong><span>${type}</span></div>
            ${money(equity, isDeposit ? t("净值", "Equity") : t("可取", "Withdrawable"))}
          </button>
        `).join("");
        return;
      }

      if (drawer === "depositChannel") {
        const channels = depositChannels(appState.depositAmount);
        const selected = selectedDepositChannel(appState.depositAmount);
        drawerTitle.textContent = t("通道", "Channel");
        drawerList.innerHTML = channels.map(channel => `
          <button class="channel-card ${selected && selected.id === channel.id ? "active" : ""} ${channel.enabled ? "" : "disabled"}" type="button" data-select-deposit-channel="${channel.id}" ${channel.enabled ? "" : "aria-disabled=\"true\""}>
            <div><strong>${channel.name}</strong><span>${channel.currency} · $${channel.min.toLocaleString("en-US")} - $${channel.max.toLocaleString("en-US")}</span></div>
            ${channel.enabled ? badge(t("可选", "Available"), "green") : badge(t("超限", "Blocked"), "gray")}
          </button>
        `).join("");
        return;
      }

      if (drawer === "withdrawMethod") {
        const methods = payoutMethods(kind);
        const selected = selectedPayoutMethod(kind);
        drawerTitle.textContent = t("收款方式", "Receiving Method");
        drawerList.innerHTML = methods.map(method => `
          <button class="channel-card ${selected[0] === method[0] ? "active" : ""}" type="button" data-select-withdraw-method="${method[0]}">
            <div><strong>${method[1]}</strong><span>${method[2]} · ${t("费用", "Fee")} ${method[3]} · ${method[4]}</span></div>
            ${badge(selected[0] === method[0] ? t("已选", "Selected") : t("可选", "Available"), selected[0] === method[0] ? "blue" : "green")}
          </button>
        `).join("");
      }
    }

    function renderFlowAction() {
      let label = "";
      let disabled = false;
      const kind = roleKind();

      if (appState.scene === "deposit" && (appState.role === "client" || appState.role === "ib")) {
        label = t("提交存款", "Submit Deposit");
        disabled = !resolveDepositAccount(kind);
      }

      if (appState.scene === "withdraw" && (appState.role === "client" || appState.role === "ib")) {
        label = t("确认取款", "Confirm Withdrawal");
        disabled = !resolveWithdrawAccount(kind);
      }

      if (appState.scene === "transfer" && (appState.role === "client" || appState.role === "ib")) {
        label = t("立即转账", "Transfer Now");
      }

      flowAction.classList.toggle("show", Boolean(label));
      flowAction.innerHTML = label ? `<button class="primary" type="button" ${disabled ? "disabled" : ""}>${label}</button>` : "";
    }

    function renderScreen() {
      ensureScene();
      const role = roles[appState.role];
      const renderer = screens[appState.role][appState.scene] || screens[appState.role][role.scenes[0][0]];
      title.textContent = sceneName(appState.scene);
      roleChip.textContent = role.chip;
      screen.innerHTML = renderer();
      renderTabbar();
      renderControls();
      renderFlowAction();
      renderDrawer();
    }

    roleSelect.addEventListener("change", (event) => {
      appState.role = event.target.value;
      appState.depositEntry = "home";
      appState.depositAccount = null;
      appState.withdrawEntry = "home";
      appState.withdrawAccount = null;
      appState.activeDrawer = null;
      ensureScene();
      renderScreen();
    });

    sceneSelect.addEventListener("change", (event) => {
      appState.scene = event.target.value;
      if (appState.scene === "deposit") {
        appState.depositEntry = "home";
        appState.depositAccount = null;
      }
      if (appState.scene === "withdraw") {
        appState.withdrawEntry = "home";
        appState.withdrawAccount = null;
      }
      appState.activeDrawer = null;
      renderScreen();
    });

    languageSelect.addEventListener("change", (event) => {
      appState.lang = event.target.value;
      renderScreen();
    });

    themeSelect.addEventListener("change", (event) => {
      appState.theme = event.target.value;
      renderScreen();
    });

    accountModeSelect.addEventListener("change", (event) => {
      appState.accountMode = event.target.value;
      appState.depositAccount = null;
      appState.withdrawAccount = null;
      renderScreen();
    });

    roleButtons.addEventListener("click", (event) => {
      const button = event.target.closest("[data-role]");
      if (!button) return;
      appState.role = button.dataset.role;
      appState.depositEntry = "home";
      appState.depositAccount = null;
      appState.withdrawEntry = "home";
      appState.withdrawAccount = null;
      appState.activeDrawer = null;
      ensureScene();
      renderScreen();
    });

    tabbar.addEventListener("click", (event) => {
      const button = event.target.closest("[data-tab]");
      if (!button) return;
      appState.scene = button.dataset.tab;
      if (appState.scene !== "deposit") {
        appState.depositEntry = appState.scene === "tradeAccount" ? "tradeAccount" : "home";
      }
      if (appState.scene !== "withdraw") {
        appState.withdrawEntry = appState.scene === "tradeAccount" ? "tradeAccount" : "home";
      }
      appState.activeDrawer = null;
      renderScreen();
    });

    screen.addEventListener("click", (event) => {
      const drawerButton = event.target.closest("[data-open-drawer]");
      if (drawerButton) {
        if (drawerButton.getAttribute("aria-disabled") === "true") return;
        appState.activeDrawer = drawerButton.dataset.openDrawer;
        renderDrawer();
        return;
      }

      const amountButton = event.target.closest("[data-amount]");
      if (amountButton) {
        appState.depositAmount = Number(amountButton.dataset.amount);
        renderScreen();
        return;
      }

      const withdrawAmountButton = event.target.closest("[data-withdraw-amount]");
      if (withdrawAmountButton) {
        appState.withdrawAmount = Number(withdrawAmountButton.dataset.withdrawAmount);
        renderScreen();
        return;
      }

      const accountButton = event.target.closest("[data-account]");
      if (accountButton) {
        appState.depositAccount = accountButton.dataset.account;
        renderScreen();
        return;
      }

      const withdrawAccountButton = event.target.closest("[data-withdraw-account]");
      if (withdrawAccountButton) {
        appState.withdrawAccount = withdrawAccountButton.dataset.withdrawAccount;
        renderScreen();
        return;
      }

      const button = event.target.closest("[data-jump]");
      if (!button) return;
      appState.scene = button.dataset.jump;
      if (appState.scene === "deposit") {
        appState.depositEntry = button.dataset.entry || "home";
        appState.depositAccount = appState.depositEntry === "tradeAccount" ? (button.dataset.accountId || "MT5-204882") : null;
      }
      if (appState.scene === "withdraw") {
        appState.withdrawEntry = button.dataset.entry || "home";
        appState.withdrawAccount = appState.withdrawEntry === "tradeAccount" ? (button.dataset.accountId || "MT5-204882") : null;
      }
      renderScreen();
    });

    drawerBackdrop.addEventListener("click", closeDrawer);

    bottomDrawer.addEventListener("click", (event) => {
      if (event.target.closest("[data-close-drawer]")) {
        closeDrawer();
        return;
      }

      const depositAccount = event.target.closest("[data-select-deposit-account]");
      if (depositAccount) {
        appState.depositAccount = depositAccount.dataset.selectDepositAccount;
        appState.activeDrawer = null;
        renderScreen();
        return;
      }

      const withdrawAccount = event.target.closest("[data-select-withdraw-account]");
      if (withdrawAccount) {
        appState.withdrawAccount = withdrawAccount.dataset.selectWithdrawAccount;
        appState.activeDrawer = null;
        renderScreen();
        return;
      }

      const depositChannel = event.target.closest("[data-select-deposit-channel]");
      if (depositChannel) {
        if (depositChannel.getAttribute("aria-disabled") === "true") return;
        appState.depositChannel = depositChannel.dataset.selectDepositChannel;
        appState.activeDrawer = null;
        renderScreen();
        return;
      }

      const withdrawMethod = event.target.closest("[data-select-withdraw-method]");
      if (withdrawMethod) {
        appState.withdrawMethod = withdrawMethod.dataset.selectWithdrawMethod;
        appState.activeDrawer = null;
        renderScreen();
      }
    });

    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }

    renderScreen();
    window.scrollTo(0, 0);
  </script>
